<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星语心愿 · 浪漫留言板</title>
    <style>
        /* ==================== CSS 变量与主题 ==================== */
        :root {
            --bg-gradient-start: #f8e8f0;
            --bg-gradient-mid: #e8d5f5;
            --bg-gradient-end: #d5e8f5;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-bg-strong: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.55);
            --glass-shadow: 0 8px 40px rgba(120, 80, 140, 0.12);
            --text-primary: #2d1b3d;
            --text-secondary: #6b5a7d;
            --text-muted: #9a8aaa;
            --accent-1: #ff6b9d;
            --accent-2: #a18cd1;
            --accent-3: #6ba6ff;
            --accent-gradient: linear-gradient(135deg, #ff6b9d, #a18cd1, #6ba6ff);
            --accent-gradient-soft: linear-gradient(135deg, rgba(255, 107, 157, 0.15), rgba(161, 140, 209, 0.15), rgba(107, 166, 255, 0.15));
            --success: #4caf50;
            --error: #e74c3c;
            --warning: #f39c12;
            --input-bg: rgba(255, 255, 255, 0.55);
            --input-border: rgba(255, 255, 255, 0.7);
            --card-hover-transform: translateY(-4px);
            --transition-speed: 0.35s;
            --radius-sm: 10px;
            --radius-md: 18px;
            --radius-lg: 26px;
            --radius-xl: 36px;
            --font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            --nav-height: 70px;
            --particle-opacity: 0.5;
            --scrollbar-thumb: rgba(161, 140, 209, 0.4);
            --scrollbar-thumb-hover: rgba(161, 140, 209, 0.7);
        }

        [data-theme="dark"] {
            --bg-gradient-start: #0d0a1a;
            --bg-gradient-mid: #1a1028;
            --bg-gradient-end: #0f1a2e;
            --glass-bg: rgba(20, 15, 35, 0.55);
            --glass-bg-strong: rgba(25, 18, 45, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
            --text-primary: #f0e8ff;
            --text-secondary: #c5b8d9;
            --text-muted: #8a7a9e;
            --accent-1: #ff7eb3;
            --accent-2: #b39ddb;
            --accent-3: #82b1ff;
            --accent-gradient: linear-gradient(135deg, #ff7eb3, #b39ddb, #82b1ff);
            --accent-gradient-soft: linear-gradient(135deg, rgba(255, 126, 179, 0.12), rgba(179, 157, 219, 0.12), rgba(130, 177, 255, 0.12));
            --input-bg: rgba(255, 255, 255, 0.07);
            --input-border: rgba(255, 255, 255, 0.15);
            --card-hover-transform: translateY(-4px);
            --particle-opacity: 0.35;
            --scrollbar-thumb: rgba(179, 157, 219, 0.35);
            --scrollbar-thumb-hover: rgba(179, 157, 219, 0.6);
        }

        /* ==================== 全局样式 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: var(--font-family);
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-mid), var(--bg-gradient-end));
            background-attachment: fixed;
            color: var(--text-primary);
            transition: background var(--transition-speed) ease, color var(--transition-speed) ease;
            overflow-x: hidden;
            position: relative;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ==================== 浮动背景粒子 ==================== */
        .bg-particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bg-particle {
            position: absolute;
            border-radius: 50%;
            background: var(--accent-gradient);
            opacity: var(--particle-opacity);
            animation: floatParticle var(--duration, 20s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
            filter: blur(2px);
        }
        @keyframes floatParticle {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(var(--dx1, 30px), var(--dy1, -40px)) scale(1.1);
            }
            50% {
                transform: translate(var(--dx2, -20px), var(--dy2, -60px)) scale(0.95);
            }
            75% {
                transform: translate(var(--dx3, 40px), var(--dy3, -20px)) scale(1.05);
            }
        }

        /* ==================== 滚动条 ==================== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        /* ==================== 容器 ==================== */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        /* ==================== 顶部导航 ==================== */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 14px 0;
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            background: var(--glass-bg);
            border-bottom: 1px solid var(--glass-border);
            transition: all var(--transition-speed) ease;
        }
        .navbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .navbar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 1px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none;
            text-decoration: none;
            white-space: nowrap;
        }
        .navbar-logo svg {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .nav-user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 50px;
            background: var(--glass-bg-strong);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all var(--transition-speed) ease;
            cursor: default;
            user-select: none;
        }
        .nav-user-badge .account-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulseDot 2s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.5);
            }
            50% {
                box-shadow: 0 0 0 6px rgba(76, 175, 80, 0);
            }
        }

        /* 主题切换按钮 */
        .theme-toggle-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg-strong);
            backdrop-filter: blur(12px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-speed) ease;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
        }
        .theme-toggle-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 20px rgba(161, 140, 209, 0.25);
        }
        .theme-toggle-btn svg {
            width: 22px;
            height: 22px;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        [data-theme="dark"] .theme-toggle-btn .icon-sun {
            transform: rotate(0deg) scale(1);
            opacity: 1;
        }
        [data-theme="dark"] .theme-toggle-btn .icon-moon {
            transform: rotate(90deg) scale(0);
            opacity: 0;
            position: absolute;
        }
        [data-theme="light"] .theme-toggle-btn .icon-sun {
            transform: rotate(-90deg) scale(0);
            opacity: 0;
            position: absolute;
        }
        [data-theme="light"] .theme-toggle-btn .icon-moon {
            transform: rotate(0deg) scale(1);
            opacity: 1;
        }

        /* ==================== 英雄区域 ==================== */
        .hero {
            text-align: center;
            padding: 50px 0 30px;
            position: relative;
        }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: var(--accent-gradient-soft);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(8px);
            color: var(--text-secondary);
            margin-bottom: 20px;
            animation: fadeInUp 0.8s ease-out;
        }
        .hero-badge svg {
            width: 16px;
            height: 16px;
        }
        .hero h1 {
            font-size: clamp(2.2rem, 6vw, 4rem);
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1.15;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            animation: fadeInUp 0.8s ease-out 0.15s both;
        }
        .hero-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            color: var(--text-secondary);
            max-width: 640px;
            margin: 0 auto 10px;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }
        .hero-divider {
            width: 80px;
            height: 3px;
            border-radius: 2px;
            background: var(--accent-gradient);
            margin: 16px auto 0;
            animation: fadeInUp 0.8s ease-out 0.45s both;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==================== 统计面板 ==================== */
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin: 30px 0 40px;
            animation: fadeInUp 0.8s ease-out 0.5s both;
        }
        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 18px 16px;
            text-align: center;
            transition: all var(--transition-speed) ease;
            box-shadow: var(--glass-shadow);
        }
        .stat-card:hover {
            transform: var(--card-hover-transform);
            border-color: var(--accent-2);
        }
        .stat-card .stat-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: var(--accent-gradient-soft);
            color: var(--accent-2);
        }
        .stat-card .stat-icon svg {
            width: 22px;
            height: 22px;
        }
        .stat-card .stat-number {
            font-size: 1.7rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }
        .stat-card .stat-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ==================== 主布局 ==================== */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
            margin-bottom: 50px;
            align-items: start;
        }

        @media (max-width: 960px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* ==================== 玻璃卡片通用 ==================== */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(1.3);
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--glass-shadow);
            padding: 24px;
            transition: all var(--transition-speed) ease;
        }
        .glass-card:hover {
            border-color: rgba(161, 140, 209, 0.35);
        }

        /* ==================== 留言发布区域 ==================== */
        .compose-card {
            margin-bottom: 28px;
            animation: fadeInUp 0.8s ease-out 0.55s both;
        }
        .compose-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-primary);
        }
        .compose-header svg {
            width: 22px;
            height: 22px;
            color: var(--accent-2);
        }
        .compose-textarea {
            width: 100%;
            min-height: 100px;
            max-height: 200px;
            resize: vertical;
            padding: 16px 18px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--input-border);
            background: var(--input-bg);
            backdrop-filter: blur(8px);
            font-family: var(--font-family);
            font-size: 0.95rem;
            color: var(--text-primary);
            transition: all var(--transition-speed) ease;
            outline: none;
            line-height: 1.6;
            letter-spacing: 0.3px;
        }
        .compose-textarea:focus {
            border-color: var(--accent-2);
            box-shadow: 0 0 0 3px rgba(161, 140, 209, 0.2);
            background: var(--glass-bg-strong);
        }
        .compose-textarea::placeholder {
            color: var(--text-muted);
            font-style: italic;
        }
        .compose-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .color-picker-group .color-label {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .color-picker-group .color-label svg {
            width: 14px;
            height: 14px;
        }
        .color-swatches {
            display: flex;
            gap: 6px;
        }
        .color-swatch {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2.5px solid transparent;
            transition: all 0.25s ease;
            position: relative;
        }
        .color-swatch:hover {
            transform: scale(1.15);
        }
        .color-swatch.active {
            border-color: var(--text-primary);
            box-shadow: 0 0 12px rgba(161, 140, 209, 0.5);
        }
        .color-swatch .check-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .color-swatch.active .check-icon {
            opacity: 1;
        }
        .compose-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 50px;
            border: none;
            background: var(--accent-gradient);
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: var(--font-family);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }
        .compose-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(161, 140, 209, 0.4);
        }
        .compose-btn:active {
            transform: translateY(0);
        }
        .compose-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .compose-btn svg {
            width: 18px;
            height: 18px;
        }
        .compose-btn.loading svg {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from {
                transform: rotate(0);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* ==================== 筛选/排序 ==================== */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .filter-bar .filter-label {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .filter-bar .filter-label svg {
            width: 14px;
            height: 14px;
        }
        .filter-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .filter-pill {
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg-strong);
            color: var(--text-secondary);
            transition: all 0.25s ease;
            user-select: none;
            font-family: var(--font-family);
            letter-spacing: 0.3px;
        }
        .filter-pill:hover {
            border-color: var(--accent-2);
            color: var(--text-primary);
        }
        .filter-pill.active {
            background: var(--accent-gradient);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(161, 140, 209, 0.3);
        }

        /* ==================== 留言列表 ==================== */
        .messages-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            transition: all var(--transition-speed) ease;
            box-shadow: var(--glass-shadow);
            position: relative;
            overflow: hidden;
        }
        .message-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--msg-color, var(--accent-1));
            border-radius: 0 2px 2px 0;
            transition: all 0.3s ease;
        }
        .message-card:hover {
            transform: var(--card-hover-transform);
            box-shadow: 0 12px 40px rgba(120, 80, 140, 0.18);
        }
        .message-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .message-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-gradient-soft);
            color: var(--accent-2);
            flex-shrink: 0;
            border: 1.5px solid var(--glass-border);
        }
        .message-avatar svg {
            width: 22px;
            height: 22px;
        }
        .message-author {
            flex: 1;
            min-width: 0;
        }
        .message-author .author-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .message-author .author-account {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.8px;
            font-family: 'Courier New', monospace;
        }
        .message-time {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .message-time svg {
            width: 12px;
            height: 12px;
        }
        .message-content {
            font-size: 0.95rem;
            color: var(--text-primary);
            line-height: 1.7;
            letter-spacing: 0.3px;
            margin-bottom: 12px;
            word-break: break-word;
            padding-left: 4px;
        }
        .message-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }
        .like-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg-strong);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.28s ease;
            font-family: var(--font-family);
            letter-spacing: 0.4px;
        }
        .like-btn:hover {
            border-color: var(--accent-1);
            color: var(--accent-1);
            transform: scale(1.05);
        }
        .like-btn.liked {
            background: rgba(255, 107, 157, 0.2);
            border-color: var(--accent-1);
            color: var(--accent-1);
            animation: likePop 0.4s ease;
        }
        .like-btn svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }
        .like-btn.liked svg {
            transform: scale(1.25);
            fill: var(--accent-1);
        }
        @keyframes likePop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }
        .like-count {
            font-weight: 700;
            font-size: 0.85rem;
        }

        /* ==================== 侧边栏 ==================== */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }
        .sidebar-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            box-shadow: var(--glass-shadow);
            padding: 20px;
            transition: all var(--transition-speed) ease;
        }
        .sidebar-card:hover {
            border-color: rgba(161, 140, 209, 0.3);
        }
        .sidebar-card .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        .sidebar-card .card-title svg {
            width: 18px;
            height: 18px;
            color: var(--accent-2);
        }

        /* 账号面板 */
        .account-display {
            text-align: center;
            padding: 10px 0;
        }
        .account-display .big-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            margin: 0 auto 12px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 6px 24px rgba(161, 140, 209, 0.35);
        }
        .account-display .big-avatar svg {
            width: 36px;
            height: 36px;
        }
        .account-display .nickname {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .account-display .account-number {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }
        .account-display .created-at {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .account-display .created-at svg {
            width: 12px;
            height: 12px;
        }
        .account-divider {
            height: 1px;
            background: var(--glass-border);
            margin: 14px 0;
        }
        .account-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .account-action-btn {
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg-strong);
            color: var(--text-secondary);
            transition: all 0.25s ease;
            font-family: var(--font-family);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .account-action-btn:hover {
            border-color: var(--accent-2);
            color: var(--text-primary);
        }
        .account-action-btn.danger:hover {
            border-color: var(--error);
            color: var(--error);
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .form-input {
            width: 100%;
            padding: 11px 16px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--input-border);
            background: var(--input-bg);
            backdrop-filter: blur(8px);
            font-family: var(--font-family);
            font-size: 0.9rem;
            color: var(--text-primary);
            transition: all var(--transition-speed) ease;
            outline: none;
            letter-spacing: 0.3px;
        }
        .form-input:focus {
            border-color: var(--accent-2);
            box-shadow: 0 0 0 3px rgba(161, 140, 209, 0.15);
        }
        .form-input::placeholder {
            color: var(--text-muted);
        }
        .form-submit-btn {
            width: 100%;
            padding: 12px;
            border-radius: 50px;
            border: none;
            background: var(--accent-gradient);
            color: #fff;
            font-weight: 600;
            font-size: 0.88rem;
            font-family: var(--font-family);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .form-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(161, 140, 209, 0.35);
        }
        .form-submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 标签页切换 */
        .tab-switcher {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            background: var(--glass-bg-strong);
            border-radius: 50px;
            padding: 4px;
            border: 1px solid var(--glass-border);
        }
        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            border-radius: 50px;
            border: none;
            background: transparent;
            font-family: var(--font-family);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .tab-btn.active {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 4px 14px rgba(161, 140, 209, 0.3);
        }
        .tab-btn svg {
            width: 16px;
            height: 16px;
        }

        /* ==================== 通知 Toast ==================== */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            min-width: 260px;
            max-width: 380px;
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            background: var(--glass-bg-strong);
            backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastIn 0.4s cubic-bezier(0.21, 1.02, 0.73, 1);
            transition: all 0.4s ease;
            letter-spacing: 0.3px;
        }
        .toast.removing {
            opacity: 0;
            transform: translateX(120%);
        }
        .toast .toast-icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }
        .toast.success .toast-icon {
            color: var(--success);
        }
        .toast.error .toast-icon {
            color: var(--error);
        }
        .toast.info .toast-icon {
            color: var(--accent-3);
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(120%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ==================== 加载动画 ==================== */
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            gap: 14px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .loading-spinner .spinner-ring {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid var(--glass-border);
            border-top-color: var(--accent-2);
            animation: spin 0.9s linear infinite;
        }

        /* ==================== 空状态 ==================== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-state svg {
            width: 56px;
            height: 56px;
            color: var(--text-muted);
            margin-bottom: 12px;
            opacity: 0.6;
        }
        .empty-state p {
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        /* ==================== 底部 ==================== */
        .footer {
            text-align: center;
            padding: 30px 0 20px;
            color: var(--text-muted);
            font-size: 0.78rem;
            letter-spacing: 0.8px;
            border-top: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
        }
        .footer a {
            color: var(--accent-2);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .footer a:hover {
            color: var(--accent-1);
        }

        /* ==================== 响应式 ==================== */
        @media (max-width: 768px) {
            .container {
                padding: 0 14px;
            }
            .navbar {
                padding: 10px 0;
            }
            .navbar-logo {
                font-size: 1.05rem;
            }
            .navbar-logo svg {
                width: 28px;
                height: 28px;
            }
            .glass-card {
                padding: 18px 16px;
                border-radius: var(--radius-md);
            }
            .hero {
                padding: 30px 0 20px;
            }
            .compose-footer {
                flex-direction: column;
                align-items: stretch;
            }
            .color-picker-group {
                justify-content: center;
            }
            .compose-btn {
                justify-content: center;
            }
            .message-card {
                padding: 14px 16px;
            }
            .message-card-header {
                gap: 8px;
            }
            .message-avatar {
                width: 36px;
                height: 36px;
            }
            .message-avatar svg {
                width: 18px;
                height: 18px;
            }
            .toast-container {
                top: 70px;
                right: 10px;
                left: 10px;
                align-items: stretch;
            }
            .toast {
                min-width: auto;
                max-width: none;
            }
            .stats-panel {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .stat-card {
                padding: 12px 10px;
            }
            .stat-card .stat-number {
                font-size: 1.3rem;
            }
        }
        @media (max-width: 480px) {
            .navbar-inner {
                flex-direction: column;
                gap: 8px;
            }
            .navbar-actions {
                width: 100%;
                justify-content: center;
            }
            .stats-panel {
                grid-template-columns: 1fr 1fr;
            }
            .filter-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        /* ==================== 工具类 ==================== */
        .hidden {
            display: none !important;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
        .text-truncate {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- ==================== 浮动背景粒子 ==================== -->
    <div class="bg-particles" id="bgParticles" aria-hidden="true"></div>

    <!-- ==================== Toast 通知容器 ==================== -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <!-- ==================== 顶部导航 ==================== -->
    <nav class="navbar" role="navigation" aria-label="主导航">
        <div class="container navbar-inner">
            <a class="navbar-logo" href="#" aria-label="星语心愿首页">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 21s-6.7-4.35-9.33-8.11C.9 10.2 1.6 6.5 4.5 5.2c1.8-.8 3.8-.3 5.2 1.1L12 8l2.3-1.7c1.4-1.4 3.4-1.9 5.2-1.1 2.9 1.3 3.6 5 1.83 7.69C18.7 16.65 12 21 12 21z"/>
                </svg>
                <span>星语心愿</span>
            </a>
            <div class="navbar-actions">
                <div class="nav-user-badge" id="navUserBadge">
                    <span class="account-dot" aria-hidden="true"></span>
                    <span id="navUserText">未登录</span>
                </div>
                <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="切换主题" title="切换暗色/亮色模式">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- ==================== 主内容区 ==================== -->
    <main class="container" role="main">
        <!-- 英雄区 -->
        <section class="hero" aria-label="欢迎">
            <div class="hero-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2z"/>
                    <path d="M19 15l.75 2.25L22 18l-2.25.75L19 21l-.75-2.25L16 18l2.25-.75L19 15z"/>
                    <path d="M5 15l.75 2.25L8 18l-2.25.75L5 21l-.75-2.25L2 18l2.25-.75L5 15z"/>
                </svg>
                <span>浪漫留言板</span>
            </div>
            <h1>写下你的星语心愿</h1>
            <p class="hero-subtitle">在这片温柔的星空下，用文字传递最真挚的情感。每一条留言都是一颗闪耀的星。</p>
            <div class="hero-divider" aria-hidden="true"></div>
        </section>

        <!-- 统计面板 -->
        <section class="stats-panel" id="statsPanel" aria-label="留言统计">
            <div class="stat-card">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                </div>
                <div class="stat-number" id="statTotalMessages">0</div>
                <div class="stat-label">总留言</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 21s-6.7-4.35-9.33-8.11C.9 10.2 1.6 6.5 4.5 5.2c1.8-.8 3.8-.3 5.2 1.1L12 8l2.3-1.7c1.4-1.4 3.4-1.9 5.2-1.1 2.9 1.3 3.6 5 1.83 7.69C18.7 16.65 12 21 12 21z"/>
                    </svg>
                </div>
                <div class="stat-number" id="statTotalLikes">0</div>
                <div class="stat-label">总点赞</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                </div>
                <div class="stat-number" id="statTotalUsers">0</div>
                <div class="stat-label">留言用户</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 3v12m0 0l-4-4m4 4l4-4"/>
                        <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
                    </svg>
                </div>
                <div class="stat-number" id="statLatestTime">--</div>
                <div class="stat-label">最新留言</div>
            </div>
        </section>

        <!-- 主布局 -->
        <div class="main-layout">
            <!-- 左侧：发布与留言 -->
            <div class="main-content">
                <!-- 发布留言 -->
                <section class="glass-card compose-card" aria-label="发布留言">
                    <div class="compose-header">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 20h9"/>
                            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                        </svg>
                        <span>写下你的心意</span>
                    </div>
                    <textarea id="composeTextarea" class="compose-textarea" placeholder="此刻你想对谁说些什么？让文字化作星光，传递你的心意..." maxlength="500" aria-label="留言内容"></textarea>
                    <div class="compose-footer">
                        <div class="color-picker-group">
                            <span class="color-label">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="12" cy="12" r="3"/>
                                    <path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.93 4.93l2.12 2.12m9.9 9.9l2.12 2.12M19.07 4.93l-2.12 2.12m-9.9 9.9l-2.12 2.12"/>
                                </svg>
                                心情色彩
                            </span>
                            <div class="color-swatches" id="colorSwatches">
                                <button class="color-swatch active" data-color="#ff758c" style="background:#ff758c" aria-label="选择粉色" title="粉色浪漫"><span class="check-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span></button>
                                <button class="color-swatch" data-color="#a18cd1" style="background:#a18cd1" aria-label="选择紫色" title="紫色梦幻"><span class="check-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span></button>
                                <button class="color-swatch" data-color="#6ba6ff" style="background:#6ba6ff" aria-label="选择蓝色" title="蓝色温柔"><span class="check-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span></button>
                                <button class="color-swatch" data-color="#f9d976" style="background:#f9d976" aria-label="选择黄色" title="黄色温暖"><span class="check-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5a4a00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span></button>
                                <button class="color-swatch" data-color="#7bc8a4" style="background:#7bc8a4" aria-label="选择绿色" title="绿色清新"><span class="check-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span></button>
                                <button class="color-swatch" data-color="#ff9f7b" style="background:#ff9f7b" aria-label="选择橙色" title="橙色活力"><span class="check-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span></button>
                            </div>
                        </div>
                        <button class="compose-btn" id="composeSubmitBtn" aria-label="发布留言">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <line x1="22" y1="2" x2="11" y2="13"/>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                            </svg>
                            <span>寄出心意</span>
                        </button>
                    </div>
                </section>

                <!-- 筛选栏 -->
                <div class="filter-bar" role="toolbar" aria-label="留言筛选">
                    <span class="filter-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                        </svg>
                        排序：
                    </span>
                    <div class="filter-pills" id="filterPills">
                        <button class="filter-pill active" data-sort="latest" aria-pressed="true">最新优先</button>
                        <button class="filter-pill" data-sort="likes" aria-pressed="false">最多点赞</button>
                        <button class="filter-pill" data-sort="oldest" aria-pressed="false">最早发布</button>
                    </div>
                </div>

                <!-- 留言列表 -->
                <section class="messages-list" id="messagesList" aria-label="留言列表">
                    <div class="loading-spinner" id="messagesLoading">
                        <div class="spinner-ring" aria-hidden="true"></div>
                        <span>正在加载星语...</span>
                    </div>
                </section>
            </div>

            <!-- 右侧边栏 -->
            <aside class="sidebar" aria-label="侧边栏">
                <!-- 账号面板 -->
                <div class="sidebar-card" id="accountPanel">
                    <div class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        我的账号
                    </div>
                    <div id="accountContent">
                        <div class="account-display" id="loggedOutDisplay">

                <div class="sidebar-card">

                    </div>
                    <p style="font-size:0.82rem;color:var(--text-secondary);line-height:1.8;letter-spacing:0.3px;">

                    <div style="margin-top:14px;padding:12px;border-radius:var(--radius-sm);background:var(--accent-gradient-soft);border:1px solid var(--glass-border);font-size:0.78rem;color:var(--text-muted);">
