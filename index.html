    <!-- ==================== 底部 ==================== -->
    <footer class="footer" role="contentinfo">
        <div class="container">
            <p>星语心愿 · 浪漫留言板 &mdash; 用心意连接彼此</p>
        </div>
    </footer>

    <!-- ==================== JavaScript ==================== -->
    <script>
        (function() {
            'use strict';

            // ==================== 配置 ====================
            const API_BASE = 'https://156.246.95.165.nip.io';
            const TOKEN_KEY = 'love_board_token';
            const ACCOUNT_KEY = 'love_board_account';
            const NICKNAME_KEY = 'love_board_nickname';
            const THEME_KEY = 'love_board_theme';

            // ==================== DOM 引用 ====================
            const $ = (sel, ctx) => (ctx || document).querySelector(sel);
            const $$ = (sel, ctx) => Array.from((ctx || document).querySelectorAll(sel));

            const themeToggleBtn = $('#themeToggleBtn');
            const navUserText = $('#navUserText');
            const composeTextarea = $('#composeTextarea');
            const composeSubmitBtn = $('#composeSubmitBtn');
            const colorSwatches = $$('.color-swatch');
            const messagesList = $('#messagesList');
            const messagesLoading = $('#messagesLoading');
            const filterPills = $$('.filter-pill');
            const statTotalMessages = $('#statTotalMessages');
            const statTotalLikes = $('#statTotalLikes');
            const statTotalUsers = $('#statTotalUsers');
            const statLatestTime = $('#statLatestTime');
            const toastContainer = $('#toastContainer');
            const bgParticles = $('#bgParticles');
            const loggedOutDisplay = $('#loggedOutDisplay');
            const loggedInDisplay = $('#loggedInDisplay');
            const loginForm = $('#loginForm');
            const createForm = $('#createForm');
            const loginAccountInput = $('#loginAccountInput');
            const createNicknameInput = $('#createNicknameInput');
            const loginBtn = $('#loginBtn');
            const createBtn = $('#createBtn');
            const loggedInNickname = $('#loggedInNickname');
            const loggedInAccount = $('#loggedInAccount');
            const loggedInCreatedAt = $('#loggedInCreatedAt');
            const refreshUserInfoBtn = $('#refreshUserInfoBtn');
            const logoutBtn = $('#logoutBtn');
            const tabBtns = $$('.tab-btn');

            // ==================== 状态 ====================
            let authToken = localStorage.getItem(TOKEN_KEY) || '';
            let currentAccount = localStorage.getItem(ACCOUNT_KEY) || '';
            let currentNickname = localStorage.getItem(NICKNAME_KEY) || '';
            let selectedColor = '#ff758c';
            let currentSort = 'latest';
            let allMessages = [];
            let likedMessages = new Set();

            // ==================== SVG 图标库 ====================
            const ICONS = {
                heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.7-4.35-9.33-8.11C.9 10.2 1.6 6.5 4.5 5.2c1.8-.8 3.8-.3 5.2 1.1L12 8l2.3-1.7c1.4-1.4 3.4-1.9 5.2-1.1 2.9 1.3 3.6 5 1.83 7.69C18.7 16.65 12 21 12 21z"/></svg>',
                heartFilled: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M12 21s-6.7-4.35-9.33-8.11C.9 10.2 1.6 6.5 4.5 5.2c1.8-.8 3.8-.3 5.2 1.1L12 8l2.3-1.7c1.4-1.4 3.4-1.9 5.2-1.1 2.9 1.3 3.6 5 1.83 7.69C18.7 16.65 12 21 12 21z"/></svg>',
                user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
                clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
                checkCircle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
                errorCircle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
                infoCircle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
                inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
                star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2z"/><path d="M19 15l.75 2.25L22 18l-2.25.75L19 21l-.75-2.25L16 18l2.25-.75L19 15z"/><path d="M5 15l.75 2.25L8 18l-2.25.75L5 21l-.75-2.25L2 18l2.25-.75L5 15z"/></svg>',
                send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
                calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
                logout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
                refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
                key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>',
                plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
                sparkle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6l2.1 2.1M18.4 5.6l-2.1 2.1M7.5 16.3l-2.1 2.1"/></svg>',
            };

            // ==================== 背景粒子生成 ====================
            function generateParticles() {
                const count = window.innerWidth < 768 ? 15 : 30;
                let html = '';
                for (let i = 0; i < count; i++) {
                    const size = Math.random() * 8 + 4;
                    const x = Math.random() * 100;
                    const y = Math.random() * 100;
                    const duration = Math.random() * 20 + 15;
                    const delay = Math.random() * 10;
                    const dx1 = Math.random() * 60 - 30;
                    const dy1 = Math.random() * 60 - 30;
                    const dx2 = Math.random() * 60 - 30;
                    const dy2 = Math.random() * 60 - 30;
                    const dx3 = Math.random() * 60 - 30;
                    const dy3 = Math.random() * 60 - 30;
                    html += `<div class="bg-particle" style="width:${size}px;height:${size}px;left:${x}%;top:${y}%;--duration:${duration}s;--delay:${delay}s;--dx1:${dx1}px;--dy1:${dy1}px;--dx2:${dx2}px;--dy2:${dy2}px;--dx3:${dx3}px;--dy3:${dy3}px;"></div>`;
                }
                bgParticles.innerHTML = html;
            }
            generateParticles();
            window.addEventListener('resize', () => {
                generateParticles();
            });

            // ==================== 主题切换 ====================
            function getSavedTheme() {
                return localStorage.getItem(THEME_KEY) || 'light';
            }

            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem(THEME_KEY, theme);
            }
            applyTheme(getSavedTheme());

            themeToggleBtn.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'light' ? 'dark' : 'light';
                applyTheme(next);
                showToast(next === 'dark' ? '已切换到暗色模式' : '已切换到亮色模式', 'info');
            });

            // ==================== Toast 通知 ====================
            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const icon = type === 'success' ? ICONS.checkCircle :
                    type === 'error' ? ICONS.errorCircle :
                    ICONS.infoCircle;
                toast.innerHTML = `<span class="toast-icon">${icon}</span><span>${message}</span>`;
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    toast.classList.add('removing');
                    setTimeout(() => {
                        if (toast.parentNode) toast.parentNode.removeChild(toast);
                    }, 400);
                }, 3000);
            }

            // ==================== 颜色选择 ====================
            colorSwatches.forEach(swatch => {
                swatch.addEventListener('click', () => {
                    colorSwatches.forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');
                    selectedColor = swatch.dataset.color;
                });
            });

            // ==================== 账号格式化 ====================
            function formatAccount(account) {
                if (!account) return '---- ---- ---- ----';
                const clean = account.replace(/\s+/g, '');
                if (clean.length !== 16) return clean;
                return `${clean.slice(0,4)} ${clean.slice(4,8)} ${clean.slice(8,12)} ${clean.slice(12,16)}`;
            }

            function maskAccount(account) {
                if (!account) return '---- **** **** ----';
                const clean = account.replace(/\s+/g, '');
                if (clean.length < 8) return clean;
                return `${clean.slice(0,4)} **** **** ${clean.slice(-4)}`;
            }

            // ==================== 账号登录/创建 ====================
            function updateAuthUI() {
                if (authToken && currentAccount) {
                    loggedOutDisplay.classList.add('hidden');
                    loggedInDisplay.classList.remove('hidden');
                    loggedInNickname.textContent = currentNickname || '星语者';
                    loggedInAccount.textContent = formatAccount(currentAccount);
                    navUserText.textContent = currentNickname || formatAccount(currentAccount);
                    refreshUserInfo();
                } else {
                    loggedOutDisplay.classList.remove('hidden');
                    loggedInDisplay.classList.add('hidden');
                    navUserText.textContent = '未登录';
                }
            }

            // 标签页切换
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    tabBtns.forEach(b => {
                        b.classList.remove('active');
                        b.setAttribute('aria-selected', 'false');
                    });
                    btn.classList.add('active');
                    btn.setAttribute('aria-selected', 'true');
                    const tab = btn.dataset.tab;
                    if (tab === 'login') {
                        loginForm.classList.remove('hidden');
                        createForm.classList.add('hidden');
                    } else {
                        loginForm.classList.add('hidden');
                        createForm.classList.remove('hidden');
                    }
                });
            });

            // 登录
            loginBtn.addEventListener('click', async () => {
                const rawAccount = loginAccountInput.value.trim();
                if (!rawAccount) {
                    showToast('请输入账号', 'error');
                    return;
                }
                const account = rawAccount.replace(/\s+/g, '');
                if (account.length !== 16 || !/^\d{16}$/.test(account)) {
                    showToast('请输入有效的16位数字账号', 'error');
                    return;
                }
                loginBtn.disabled = true;
                loginBtn.innerHTML = '登录中...';
                try {
                    const res = await fetch(`${API_BASE}/api/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ account_number: account })
                    });
                    const data = await res.json();
                    if (data.success) {
                        authToken = data.token;
                        currentAccount = data.account_number;
                        currentNickname = data.nickname;
                        localStorage.setItem(TOKEN_KEY, authToken);
                        localStorage.setItem(ACCOUNT_KEY, currentAccount);
                        localStorage.setItem(NICKNAME_KEY, currentNickname);
                        updateAuthUI();
                        showToast('登录成功', 'success');
                        loginAccountInput.value = '';
                        await fetchMessages();
                    } else {
                        showToast(data.message || '登录失败', 'error');
                    }
                } catch (err) {
                    showToast('网络错误，请稍后重试', 'error');
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML =
                        `${ICONS.key} 登录账号`;
                }
            });

            // 创建账号
            createBtn.addEventListener('click', async () => {
                const nickname = createNicknameInput.value.trim();
                createBtn.disabled = true;
                createBtn.innerHTML = '创建中...';
                try {
                    const res = await fetch(`${API_BASE}/api/auth/create`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nickname: nickname || undefined })
                    });
                    const data = await res.json();
                    if (data.success) {
                        authToken = data.token;
                        currentAccount = data.account_number;
                        currentNickname = data.nickname;
                        localStorage.setItem(TOKEN_KEY, authToken);
                        localStorage.setItem(ACCOUNT_KEY, currentAccount);
                        localStorage.setItem(NICKNAME_KEY, currentNickname);
                        updateAuthUI();
                        showToast(`账号创建成功：${formatAccount(data.account_number)}`, 'success');
                        createNicknameInput.value = '';
                        await fetchMessages();
                    } else {
                        showToast(data.message || '创建失败', 'error');
                    }
                } catch (err) {
                    showToast('网络错误，请稍后重试', 'error');
                } finally {
                    createBtn.disabled = false;
                    createBtn.innerHTML = `${ICONS.plus} 创建新账号`;
                }
            });

            // 刷新用户信息
            async function refreshUserInfo() {
                if (!authToken) return;
                try {
                    const res = await fetch(`${API_BASE}/api/user/info`, {
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    });
                    const data = await res.json();
                    if (data.success) {
                        currentNickname = data.nickname;
                        currentAccount = data.account_number;
                        localStorage.setItem(NICKNAME_KEY, currentNickname);
                        localStorage.setItem(ACCOUNT_KEY, currentAccount);
                        loggedInNickname.textContent = data.nickname;
                        loggedInAccount.textContent = formatAccount(data.account_number);
                        navUserText.textContent = data.nickname;
                        if (data.created_at) {
                            const date = new Date(data.created_at);
                            loggedInCreatedAt.innerHTML =
                                `${ICONS.calendar} <span>${date.toLocaleDateString('zh-CN')}</span>`;
                        }
                    } else {
                        // token可能失效
                        authToken = '';
                        currentAccount = '';
                        localStorage.removeItem(TOKEN_KEY);
                        localStorage.removeItem(ACCOUNT_KEY);
                        updateAuthUI();
                    }
                } catch (err) {
                    // 静默处理
                }
            }
            refreshUserInfoBtn.addEventListener('click', refreshUserInfo);

            // 退出
            logoutBtn.addEventListener('click', () => {
                authToken = '';
                currentAccount = '';
                currentNickname = '';
                localStorage.removeItem(TOKEN_KEY);
                localStorage.removeItem(ACCOUNT_KEY);
                localStorage.removeItem(NICKNAME_KEY);
                updateAuthUI();
                showToast('已退出登录', 'info');
            });

            // ==================== 留言相关 ====================
            async function fetchMessages() {
                messagesLoading.classList.remove('hidden');
                messagesList.innerHTML = '';
                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'loading-spinner';
                loadingDiv.id = 'messagesLoading';
                loadingDiv.innerHTML =
                    '<div class="spinner-ring" aria-hidden="true"></div><span>正在加载星语...</span>';
                messagesList.appendChild(loadingDiv);
                try {
                    const res = await fetch(`${API_BASE}/api/messages`);
                    const data = await res.json();
                    if (data.success) {
                        allMessages = data.list || [];
                        renderMessages();
                        updateStats();
                    } else {
                        showToast(data.message || '加载留言失败', 'error');
                        allMessages = [];
                        renderMessages();
                        updateStats();
                    }
                } catch (err) {
                    showToast('网络错误，无法加载留言', 'error');
                    allMessages = [];
                    renderMessages();
                    updateStats();
                } finally {
                    const spinner = $('#messagesLoading');
                    if (spinner) spinner.remove();
                }
            }

            function renderMessages() {
                messagesList.innerHTML = '';
                if (!allMessages.length) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'empty-state';
                    emptyDiv.innerHTML =
                        `${ICONS.inbox}<p>还没有留言，来写下第一条星语吧</p>`;
                    messagesList.appendChild(emptyDiv);
                    return;
                }

                let sorted = [...allMessages];
                if (currentSort === 'likes') {
                    sorted.sort((a, b) => (b.likes || 0) - (a.likes || 0));
                } else if (currentSort === 'oldest') {
                    sorted.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                } else {
                    sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                }

                sorted.forEach(msg => {
                    const card = document.createElement('div');
                    card.className = 'message-card';
                    card.style.setProperty('--msg-color', msg.mood_color || '#ff758c');
                    const isLiked = likedMessages.has(msg.id);
                    const time = msg.created_at ? new Date(msg.created_at) : null;
                    const timeStr = time ? time.toLocaleDateString('zh-CN') + ' ' + time.toLocaleTimeString(
                        'zh-CN', { hour: '2-digit', minute: '2-digit' }) : '--';

                    card.innerHTML = `
                        <div class="message-card-header">
                            <div class="message-avatar">${ICONS.user}</div>
                            <div class="message-author">
                                <div class="author-name">${escapeHtml(msg.nickname || '匿名')}</div>
                                <div class="author-account">${escapeHtml(msg.masked_account || '---- **** **** ----')}</div>
                            </div>
                            <div class="message-time">${ICONS.clock} ${timeStr}</div>
                        </div>
                        <div class="message-content">${escapeHtml(msg.content)}</div>
                        <div class="message-footer">
                            <button class="like-btn ${isLiked ? 'liked' : ''}" data-id="${escapeHtml(msg.id)}" aria-label="点赞">
                                ${isLiked ? ICONS.heartFilled : ICONS.heart}
                                <span class="like-count">${msg.likes || 0}</span>
                            </button>
                        </div>
                    `;
                    messagesList.appendChild(card);

                    const likeBtn = card.querySelector('.like-btn');
                    likeBtn.addEventListener('click', () => handleLike(msg.id, likeBtn));
                });
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            async function handleLike(msgId, btn) {
                try {
                    const res = await fetch(`${API_BASE}/api/messages/${encodeURIComponent(msgId)}/like`, {
                        method: 'POST'
                    });
                    const data = await res.json();
                    if (data.success) {
                        likedMessages.add(msgId);
                        const countEl = btn.querySelector('.like-count');
                        if (countEl) countEl.textContent = data.likes;
                        btn.classList.add('liked');
                        btn.innerHTML = `${ICONS.heartFilled} <span class="like-count">${data.likes}</span>`;
                        // 更新本地数据
                        const msg = allMessages.find(m => m.id === msgId);
                        if (msg) msg.likes = data.likes;
                        updateStats();
                        btn.querySelector('.like-count').addEventListener('click', (e) => {
                            e.stopPropagation();
                            handleLike(msgId, btn);
                        });
                    } else {
                        showToast(data.message || '点赞失败', 'error');
                    }
                } catch (err) {
                    showToast('网络错误，点赞失败', 'error');
                }
            }

            function updateStats() {
                const totalMsgs = allMessages.length;
                const totalLikes = allMessages.reduce((sum, m) => sum + (m.likes || 0), 0);
                const uniqueUsers = new Set(allMessages.map(m => m.masked_account)).size;
                statTotalMessages.textContent = totalMsgs;
                statTotalLikes.textContent = totalLikes;
                statTotalUsers.textContent = uniqueUsers;
                if (allMessages.length > 0) {
                    const times = allMessages.map(m => new Date(m.created_at));
                    const latest = new Date(Math.max(...times));
                    const now = new Date();
                    const diffMs = now - latest;
                    const diffMin = Math.floor(diffMs / 60000);
                    if (diffMin < 1) statLatestTime.textContent = '刚刚';
                    else if (diffMin < 60) statLatestTime.textContent = diffMin + '分前';
                    else if (diffMin < 1440) statLatestTime.textContent = Math.floor(diffMin / 60) + '小时前';
                    else statLatestTime.textContent = Math.floor(diffMin / 1440) + '天前';
                } else {
                    statLatestTime.textContent = '--';
                }
            }

            // ==================== 发布留言 ====================
            composeSubmitBtn.addEventListener('click', async () => {
                const content = composeTextarea.value.trim();
                if (!content) {
                    showToast('请先写下你的心意', 'error');
                    composeTextarea.focus();
                    return;
                }
                if (!authToken || !currentAccount) {
                    showToast('请先登录后再发布留言', 'error');
                    return;
                }
                composeSubmitBtn.disabled = true;
                composeSubmitBtn.classList.add('loading');
                composeSubmitBtn.innerHTML =
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> 寄出中...';
                try {
                    const res = await fetch(`${API_BASE}/api/messages`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: JSON.stringify({
                            content: content,
                            mood_color: selectedColor
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        composeTextarea.value = '';
                        showToast(data.message || '心意已寄出', 'success');
                        await fetchMessages();
                    } else {
                        showToast(data.message || '发布失败', 'error');
                    }
                } catch (err) {
                    showToast('网络错误，请稍后重试', 'error');
                } finally {
                    composeSubmitBtn.disabled = false;
                    composeSubmitBtn.classList.remove('loading');
                    composeSubmitBtn.innerHTML = `${ICONS.send} 寄出心意`;
                }
            });

            // 回车快捷发布（Ctrl+Enter）
            composeTextarea.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    composeSubmitBtn.click();
                }
            });

            // ==================== 筛选排序 ====================
            filterPills.forEach(pill => {
                pill.addEventListener('click', () => {
                    filterPills.forEach(p => {
                        p.classList.remove('active');
                        p.setAttribute('aria-pressed', 'false');
                    });
                    pill.classList.add('active');
                    pill.setAttribute('aria-pressed', 'true');
                    currentSort = pill.dataset.sort;
                    renderMessages();
                });
            });

            // ==================== 初始化 ====================
            function init() {
                updateAuthUI();
                fetchMessages();
                // 每60秒自动刷新留言（可选）
                setInterval(() => {
                    if (!document.hidden) fetchMessages();
                }, 60000);
            }

            init();

            // 从localStorage恢复点赞记录（简单本地记录）
            const savedLikes = localStorage.getItem('love_board_liked');
            if (savedLikes) {
                try {
                    likedMessages = new Set(JSON.parse(savedLikes));
                } catch (e) {
                    likedMessages = new Set();
                }
            }
            // 监听点赞变化保存
            const originalAdd = likedMessages.add.bind(likedMessages);
            likedMessages.add = (val) => {
                originalAdd(val);
                localStorage.setItem('love_board_liked', JSON.stringify([...likedMessages]));
            };

        })();
    </script>
</body>
</html>
