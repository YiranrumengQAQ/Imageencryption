<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TG 云图库 · 无盘图床</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ===== CSS 变量 / 主题系统 (与之前相同，未改动) ===== */
        :root {
            --bg: #f1f5f9;
            --surface: rgba(255, 255, 255, 0.70);
            --surface-solid: #ffffff;
            --border: rgba(148, 163, 184, 0.24);
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-tertiary: #94a3b8;
            --accent-1: #7c3aed;
            --accent-2: #6366f1;
            --accent-3: #3b82f6;
            --gradient-accent: linear-gradient(135deg, #7c3aed 0%, #6366f1 35%, #3b82f6 100%);
            --gradient-glow: linear-gradient(135deg, rgba(124, 58, 237, 0.12) 0%, rgba(99, 102, 241, 0.08) 40%, rgba(59, 130, 246, 0.14) 100%);
            --gradient-highlight: linear-gradient(160deg, #8b5cf6 0%, #6366f1 30%, #60a5fa 70%, #818cf8 100%);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
            --radius: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --font: 'Inter', 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            --transition: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.42s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        [data-theme="dark"] {
            --bg: #0b0f1a;
            --surface: rgba(22, 27, 44, 0.72);
            --surface-solid: #161b2c;
            --border: rgba(255, 255, 255, 0.10);
            --text: #e8ecf4;
            --text-secondary: #94a3b8;
            --text-tertiary: #5c6b80;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background var(--transition-slow), color var(--transition-slow);
            line-height: 1.5;
            overflow-x: hidden;
            padding: clamp(12px, 3vw, 28px);
            padding-bottom: clamp(60px, 8vh, 100px);
            background-image: radial-gradient(ellipse at 30% 10%, rgba(124, 58, 237, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 85%, rgba(59, 130, 246, 0.05) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(99, 102, 241, 0.03) 0%, transparent 70%);
            background-attachment: fixed;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(124, 58, 237, 0.25);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(124, 58, 237, 0.45);
        }

        .app-wrapper {
            max-width: 820px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: clamp(14px, 2.5vw, 22px);
        }

        .glass-card {
            background: var(--surface);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            padding: clamp(18px, 3.5vw, 30px);
            transition: all var(--transition-slow);
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-accent);
            opacity: 0.55;
            border-radius: 3px 3px 0 0;
            pointer-events: none;
        }
        .glass-card:hover {
            box-shadow: var(--shadow-lg);
            border-color: rgba(124, 58, 237, 0.20);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 11px 22px;
            border-radius: 24px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            white-space: nowrap;
            font-family: var(--font);
            letter-spacing: 0.01em;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: var(--gradient-accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(124, 58, 237, 0.30);
            position: relative;
            overflow: hidden;
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.20) 0%, transparent 50%);
            pointer-events: none;
        }
        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 6px 22px rgba(124, 58, 237, 0.40);
            transform: translateY(-2px);
        }
        .btn-primary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            filter: grayscale(30%);
            pointer-events: none;
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .btn-ghost:hover {
            border-color: #8b5cf6;
            color: #7c3aed;
            background: rgba(124, 58, 237, 0.04);
        }
        .btn-sm {
            padding: 7px 15px;
            font-size: 0.80rem;
            border-radius: 18px;
        }
        .btn-block {
            width: 100%;
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.25);
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.20);
            border-color: #ef4444;
        }

        .input-field {
            width: 100%;
            padding: 11px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--surface-solid);
            color: var(--text);
            font-size: 0.92rem;
            font-family: var(--font);
            outline: none;
            transition: all var(--transition);
            min-width: 0;
        }
        .input-field:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.08);
        }
        .input-field::placeholder {
            color: var(--text-tertiary);
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: clamp(14px, 2vw, 20px) 0;
        }
        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: clamp(1.2rem, 2.8vw, 1.6rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: var(--gradient-highlight);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-header .brand i {
            font-size: clamp(1.2rem, 2.8vw, 1.6rem);
            -webkit-text-fill-color: initial;
            color: #7c3aed;
        }
        .app-header .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .app-header .account-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(124, 58, 237, 0.08);
            padding: 5px 12px 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(124, 58, 237, 0.15);
            font-size: 0.80rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-mono, monospace);
        }
        .app-header .account-badge:hover {
            background: rgba(124, 58, 237, 0.14);
        }
        .app-header .account-badge i {
            color: #7c3aed;
            font-size: 0.75rem;
        }
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            font-size: 1.05rem;
            flex-shrink: 0;
        }
        .icon-btn:hover {
            background: rgba(124, 58, 237, 0.08);
            color: #7c3aed;
        }

        .auth-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 640px) {
            .auth-grid {
                grid-template-columns: 1fr;
            }
        }
        .auth-card {
            padding: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
        }
        .auth-card h3 {
            font-size: 1.05rem;
            font-weight: 650;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .auth-card h3 i {
            color: #7c3aed;
        }
        .auth-card .input-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .auth-card .input-group .input-field {
            flex: 1;
        }

        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius-lg);
            padding: clamp(24px, 4vw, 40px) clamp(14px, 2.5vw, 24px);
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            background: rgba(124, 58, 237, 0.015);
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        .upload-zone:hover,
        .upload-zone.drag-over {
            border-color: #8b5cf6;
            background: rgba(124, 58, 237, 0.05);
            transform: translateY(-1px);
        }
        .upload-zone.drag-over {
            border-style: solid;
            background: rgba(124, 58, 237, 0.08);
            box-shadow: 0 0 0 8px rgba(124, 58, 237, 0.04);
        }
        .upload-zone .icon-wrap {
            width: 56px;
            height: 56px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: var(--gradient-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform var(--transition);
            font-size: 1.6rem;
            color: #7c3aed;
        }
        .upload-zone:hover .icon-wrap {
            transform: scale(1.06);
        }
        .upload-zone .zone-title {
            font-weight: 600;
            font-size: 1.0rem;
            color: var(--text);
            margin-bottom: 2px;
        }
        .upload-zone .zone-hint {
            font-size: 0.82rem;
            color: var(--text-tertiary);
        }
        #fileInputRef {
            display: none;
        }

        .progress-wrap {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .progress-bar-outer {
            height: 5px;
            background: var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        .progress-bar-inner {
            height: 100%;
            background: var(--gradient-accent);
            border-radius: 8px;
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 0;
        }
        .progress-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.80rem;
            color: var(--text-secondary);
            gap: 8px;
            flex-wrap: wrap;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin: 6px 0 2px;
        }
        .stat-item {
            background: rgba(124, 58, 237, 0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
            text-align: center;
            transition: all var(--transition);
        }
        .stat-item:hover {
            border-color: rgba(124, 58, 237, 0.25);
        }
        .stat-item .stat-number {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }
        .stat-item .stat-label {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-top: 2px;
        }
        .stat-item .stat-icon {
            color: #7c3aed;
            margin-right: 4px;
            font-size: 0.9rem;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0 4px;
            flex-wrap: wrap;
        }
        .search-bar .input-field {
            flex: 1;
            min-width: 140px;
            padding: 9px 14px;
        }
        .search-bar .sort-select {
            padding: 9px 14px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--surface-solid);
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
        }
        .search-bar .sort-select:focus {
            border-color: #8b5cf6;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 14px;
            margin-top: 12px;
        }
        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }
        }
        .gallery-item {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background: var(--border);
            cursor: pointer;
            transition: all var(--transition);
            border: 1px solid var(--border);
        }
        .gallery-item:hover {
            transform: scale(1.02);
            border-color: rgba(124, 58, 237, 0.30);
            box-shadow: var(--shadow-md);
            z-index: 2;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform var(--transition);
        }
        .gallery-item:hover img {
            transform: scale(1.04);
        }
        .gallery-item .item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px 12px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.60));
            color: #fff;
            font-size: 0.75rem;
            opacity: 0;
            transition: opacity var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gallery-item:hover .item-overlay {
            opacity: 1;
        }
        .gallery-item .item-overlay .name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }
        .gallery-item .item-overlay .size {
            font-size: 0.70rem;
            opacity: 0.8;
        }
        .gallery-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-tertiary);
        }
        .gallery-empty i {
            font-size: 2.8rem;
            opacity: 0.4;
            margin-bottom: 12px;
            display: block;
        }

        .modal-mask {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: opacity var(--transition-slow);
        }
        .modal-content {
            background: var(--surface);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 720px;
            max-height: 92vh;
            overflow-y: auto;
            padding: clamp(16px, 3vw, 24px);
            position: relative;
            transition: transform var(--transition-slow);
        }
        .modal-content .modal-close {
            position: absolute;
            top: 10px;
            right: 12px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.06);
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            line-height: 1;
            z-index: 5;
        }
        .modal-content .modal-close:hover {
            background: rgba(124, 58, 237, 0.12);
            color: #7c3aed;
            transform: rotate(90deg);
        }
        .modal-content .preview-img-wrap {
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--border);
            margin-bottom: 14px;
            text-align: center;
        }
        .modal-content .preview-img-wrap img {
            max-width: 100%;
            max-height: 55vh;
            display: block;
            margin: 0 auto;
            object-fit: contain;
        }
        .modal-content .preview-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            font-size: 0.88rem;
            color: var(--text-secondary);
            padding: 4px 0;
        }
        .modal-content .preview-meta strong {
            color: var(--text);
        }
        .modal-content .preview-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }
        .modal-content .preview-actions .btn {
            flex: 1;
            min-width: 80px;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: 100%;
            pointer-events: none;
        }
        .toast-item {
            pointer-events: auto;
            padding: 12px 18px;
            border-radius: var(--radius);
            background: var(--surface);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.88rem;
            color: var(--text);
            animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            transition: all var(--transition);
        }
        .toast-item.success {
            border-left: 4px solid #22c55e;
        }
        .toast-item.error {
            border-left: 4px solid #ef4444;
        }
        .toast-item.warning {
            border-left: 4px solid #f59e0b;
        }
        .toast-item.info {
            border-left: 4px solid #3b82f6;
        }
        .toast-item .toast-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .toast-item .toast-close {
            margin-left: auto;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity var(--transition);
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.0rem;
        }
        .toast-item .toast-close:hover {
            opacity: 1;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
                padding-bottom: 80px;
            }
            .glass-card {
                border-radius: var(--radius-lg);
                padding: 14px;
            }
            .app-header .brand {
                font-size: 1.1rem;
            }
            .app-header .account-badge {
                font-size: 0.70rem;
                padding: 4px 10px 4px 12px;
            }
            .stats-row {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .stat-item {
                padding: 8px 6px;
            }
            .stat-item .stat-number {
                font-size: 1.1rem;
            }
            .stat-item .stat-label {
                font-size: 0.65rem;
            }
            .search-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .search-bar .sort-select {
                width: 100%;
            }
            .modal-content {
                max-width: 98vw;
                max-height: 94vh;
                padding: 14px;
            }
            .modal-content .preview-actions .btn {
                flex: 1 1 100%;
            }
            .toast-container {
                top: 10px;
                right: 10px;
                max-width: calc(100% - 20px);
            }
        }
        @media (min-width: 1400px) {
            .app-wrapper {
                max-width: 900px;
            }
        }

        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .gap-8 {
            gap: 8px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .text-center {
            text-align: center;
        }
        .text-muted {
            color: var(--text-tertiary);
            font-size: 0.82rem;
        }
        .hidden {
            display: none !important;
        }
        .w-full {
            width: 100%;
        }
        .flex-wrap {
            flex-wrap: wrap;
        }

        .fade-enter-active,
        .fade-leave-active {
            transition: opacity var(--transition-slow), transform var(--transition-slow);
        }
        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
            transform: scale(0.96);
        }
    </style>
</head>

<body>

    <div id="app">
        <!-- ===== Toast 容器 ===== -->
        <div class="toast-container">
            <div v-for="(toast, idx) in toasts" :key="idx" class="toast-item" :class="toast.type">
                <span class="toast-icon">
                    <i v-if="toast.type === 'success'" class="fas fa-check-circle" style="color:#22c55e;"></i>
                    <i v-else-if="toast.type === 'error'" class="fas fa-times-circle" style="color:#ef4444;"></i>
                    <i v-else-if="toast.type === 'warning'" class="fas fa-triangle-exclamation" style="color:#f59e0b;"></i>
                    <i v-else class="fas fa-info-circle" style="color:#3b82f6;"></i>
                </span>
                <span>{{ toast.message }}</span>
                <button class="toast-close" @click="removeToast(idx)">&times;</button>
            </div>
        </div>

        <div class="app-wrapper">

            <!-- ===== Header ===== -->
            <header class="app-header">
                <div class="brand">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span>TG 云图库</span>
                </div>
                <div class="header-actions">
                    <template v-if="accountId">
                        <span class="account-badge" @click="copyAccount" title="点击复制账号">
                            <i class="fas fa-user-circle"></i>
                            {{ accountId.slice(0, 6) }}...{{ accountId.slice(-4) }}
                            <i class="fas fa-copy" style="font-size:0.65rem;opacity:0.6;"></i>
                        </span>
                        <button class="icon-btn" @click="logout" title="登出">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </template>
                    <button class="icon-btn" @click="toggleTheme" :title="theme === 'dark' ? '切换亮色' : '切换暗色'">
                        <i v-if="theme === 'dark'" class="fas fa-sun"></i>
                        <i v-else class="fas fa-moon"></i>
                    </button>
                </div>
            </header>

            <!-- ===== 未登录：登录/注册 ===== -->
            <div v-if="!accountId" class="glass-card">
                <div class="auth-grid">
                    <div class="auth-card">
                        <h3><i class="fas fa-sign-in-alt"></i> 登录</h3>
                        <p class="text-muted" style="margin-bottom:10px;">输入 16 位账号登录</p>
                        <div class="input-group">
                            <input class="input-field" v-model="loginInput" placeholder="例如 aB8dEf01Gh23Ij4k" maxlength="16" @keyup.enter="doLogin" />
                            <button class="btn btn-primary" @click="doLogin" :disabled="loginInput.length !== 16">
                                登录
                            </button>
                        </div>
                    </div>
                    <div class="auth-card">
                        <h3><i class="fas fa-user-plus"></i> 注册</h3>
                        <p class="text-muted" style="margin-bottom:10px;">生成新账号，自动登录</p>
                        <button class="btn btn-primary btn-block" @click="doRegister" :disabled="registering">
                            <i v-if="registering" class="fas fa-spinner fa-spin"></i>
                            <span v-else><i class="fas fa-plus-circle"></i> 生成新账号</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ===== 已登录：主面板 ===== -->
            <template v-else>

                <!-- ===== 上传区域 ===== -->
                <div class="glass-card">
                    <div class="upload-zone" :class="{ 'drag-over': isDragging }" @click="triggerFileInput" @dragover.prevent="isDragging = true" @dragleave.prevent="isDragging = false" @drop.prevent="handleDrop">
                        <div class="icon-wrap">
                            <i class="fas fa-cloud-upload-alt"></i>
                        </div>
                        <p class="zone-title">{{ uploading ? '上传中...' : '点击或拖拽图片到此处' }}</p>
                        <p class="zone-hint">支持 JPG / PNG / WEBP / GIF，单张最大 20 MB</p>
                        <input type="file" id="fileInputRef" accept="image/*" @change="onFilePicked" ref="fileInputRef" :disabled="uploading" />
                    </div>

                    <!-- 上传进度 -->
                    <div class="progress-wrap" v-if="uploading">
                        <div class="progress-bar-outer">
                            <div class="progress-bar-inner" :style="{ width: uploadProgress + '%' }"></div>
                        </div>
                        <div class="progress-meta">
                            <span>{{ uploadStatus }}</span>
                            <span>{{ Math.round(uploadProgress) }}%</span>
                        </div>
                    </div>
                </div>

                <!-- ===== 统计 + 搜索 ===== -->
                <div class="glass-card" style="padding:clamp(14px,2vw,20px);">
                    <div class="stats-row">
                        <div class="stat-item">
                            <div class="stat-number"><i class="stat-icon fas fa-images"></i> {{ images.length }}</div>
                            <div class="stat-label">图片总数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number"><i class="stat-icon fas fa-weight-hanging"></i> {{ totalSize }}</div>
                            <div class="stat-label">总大小</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number"><i class="stat-icon fas fa-clock"></i> {{ images.length > 0 ? '活跃' : '空' }}</div>
                            <div class="stat-label">状态</div>
                        </div>
                    </div>

                    <div class="search-bar">
                        <input class="input-field" v-model="searchQuery" placeholder="🔍 搜索图片名称..." />
                        <select class="sort-select" v-model="sortBy">
                            <option value="newest">最新优先</option>
                            <option value="oldest">最早优先</option>
                            <option value="name">按名称</option>
                            <option value="size">按大小</option>
                        </select>
                        <button class="btn btn-sm btn-ghost" @click="refreshGallery" :disabled="galleryLoading">
                            <i class="fas fa-sync-alt" :class="{ 'fa-spin': galleryLoading }"></i>
                        </button>
                    </div>
                </div>

                <!-- ===== 图库网格 ===== -->
                <div class="glass-card" style="padding:clamp(14px,2vw,20px);">
                    <div v-if="galleryLoading" class="text-center" style="padding:30px 0;">
                        <i class="fas fa-spinner fa-spin" style="font-size:2rem;color:#7c3aed;"></i>
                        <p class="text-muted" style="margin-top:8px;">加载图库中...</p>
                    </div>
                    <div v-else-if="filteredImages.length === 0" class="gallery-empty">
                        <i class="fas fa-image"></i>
                        <p>{{ searchQuery ? '没有匹配的图片' : '图库为空，上传第一张图片吧' }}</p>
                    </div>
                    <div v-else class="gallery-grid">
                        <div v-for="img in filteredImages" :key="img.id" class="gallery-item" @click="openPreview(img)">
                            <img :src="img.url" :alt="img.file_name" loading="lazy" @error="handleImageError($event, img)" />
                            <div class="item-overlay">
                                <span class="name">{{ img.file_name }}</span>
                                <span class="size">{{ formatFileSize(img.file_size) }}</span>
                            </div>
                        </div>
                    </div>
                    <div v-if="!galleryLoading && images.length > 0" style="margin-top:12px;text-align:center;font-size:0.80rem;color:var(--text-tertiary);">
                        共 {{ images.length }} 张图片
                    </div>
                </div>

            </template>

            <!-- ===== Footer ===== -->
            <footer style="text-align:center;padding:12px 0 4px;font-size:0.75rem;color:var(--text-tertiary);">
                <i class="fas fa-shield-alt"></i> 无盘存储 · 数据仅存于 Telegram
                <span style="margin:0 8px;">|</span>
                <i class="fas fa-lock"></i> 端到端加密传输
            </footer>

        </div><!-- /app-wrapper -->

        <!-- ===== 图片预览模态框 ===== -->
        <teleport to="body">
            <div class="modal-mask" v-if="previewVisible" @click.self="closePreview">
                <div class="modal-content">
                    <button class="modal-close" @click="closePreview">&times;</button>
                    <div class="preview-img-wrap">
                        <img :src="previewImage?.url" :alt="previewImage?.file_name" />
                    </div>
                    <div class="preview-meta">
                        <span><strong>名称</strong> {{ previewImage?.file_name }}</span>
                        <span><strong>大小</strong> {{ formatFileSize(previewImage?.file_size || 0) }}</span>
                        <span><strong>ID</strong> #{{ previewImage?.id }}</span>
                    </div>
                    <div class="preview-actions">
                        <button class="btn btn-primary" @click="copyLink">
                            <i class="fas fa-link"></i> 复制压缩直链
                        </button>
                        <button class="btn btn-ghost" @click="copyRawLink">
                            <i class="fas fa-file-image"></i> 复制原图直链
                        </button>
                        <button class="btn btn-ghost" @click="downloadImage">
                            <i class="fas fa-download"></i> 下载
                        </button>
                        <button class="btn btn-ghost" @click="openInNewTab">
                            <i class="fas fa-external-link-alt"></i> 新窗口
                        </button>
                    </div>
                </div>
            </div>
        </teleport>

    </div>

    <script>
        const { createApp, ref, reactive, computed, watch, onMounted } = Vue;

        const API_BASE = 'https://node-0crq9b.156.246.95.165.nip.io';

        function formatFileSize(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
        }

        const app = createApp({
            setup() {
                // ---- 状态 ----
                const accountId = ref(localStorage.getItem('tg_gallery_account') || '');
                const theme = ref(localStorage.getItem('tg_gallery_theme') || 'light');

                const loginInput = ref('');
                const registering = ref(false);

                const fileInputRef = ref(null);
                const isDragging = ref(false);
                const uploading = ref(false);
                const uploadProgress = ref(0);
                const uploadStatus = ref('');

                const images = ref([]);
                const galleryLoading = ref(false);
                const searchQuery = ref('');
                const sortBy = ref('newest');

                const previewVisible = ref(false);
                const previewImage = ref(null);

                const toasts = reactive([]);

                // ---- 计算属性 ----
                const filteredImages = computed(() => {
                    let list = [...images.value];
                    if (searchQuery.value.trim()) {
                        const q = searchQuery.value.trim().toLowerCase();
                        list = list.filter(img => img.file_name.toLowerCase().includes(q));
                    }
                    switch (sortBy.value) {
                        case 'newest':
                            list.sort((a, b) => b.id - a.id);
                            break;
                        case 'oldest':
                            list.sort((a, b) => a.id - b.id);
                            break;
                        case 'name':
                            list.sort((a, b) => a.file_name.localeCompare(b.file_name));
                            break;
                        case 'size':
                            list.sort((a, b) => (b.file_size || 0) - (a.file_size || 0));
                            break;
                    }
                    return list;
                });

                const totalSize = computed(() => {
                    const total = images.value.reduce((sum, img) => sum + (img.file_size || 0), 0);
                    return formatFileSize(total);
                });

                // ---- Toast ----
                function addToast(message, type = 'info') {
                    toasts.push({ message, type });
                    if (toasts.length > 8) toasts.shift();
                    setTimeout(() => {
                        const idx = toasts.findIndex(t => t.message === message && t.type === type);
                        if (idx !== -1) toasts.splice(idx, 1);
                    }, 4500);
                }

                function removeToast(idx) {
                    toasts.splice(idx, 1);
                }

                // ---- 主题 ----
                function toggleTheme() {
                    theme.value = theme.value === 'dark' ? 'light' : 'dark';
                    localStorage.setItem('tg_gallery_theme', theme.value);
                    document.documentElement.setAttribute('data-theme', theme.value);
                }

                // ---- 账号 ----
                function copyAccount() {
                    if (!accountId.value) return;
                    navigator.clipboard?.writeText(accountId.value).then(() => {
                        addToast('账号已复制到剪贴板', 'success');
                    }).catch(() => {
                        const ta = document.createElement('textarea');
                        ta.value = accountId.value;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        ta.style.left = '-9999px';
                        document.body.appendChild(ta);
                        ta.select();
                        try { document.execCommand('copy');
                            addToast('账号已复制', 'success'); } catch (_) { addToast('复制失败，请手动复制', 'error'); }
                        document.body.removeChild(ta);
                    });
                }

                function logout() {
                    accountId.value = '';
                    localStorage.removeItem('tg_gallery_account');
                    images.value = [];
                    previewVisible.value = false;
                    addToast('已登出', 'info');
                }

                // ---- 注册 ----
                async function doRegister() {
                    if (registering.value) return;
                    registering.value = true;
                    try {
                        const res = await fetch(`${API_BASE}/api/register`, { method: 'POST' });
                        if (!res.ok) {
                            const err = await res.json().catch(() => ({}));
                            throw new Error(err.detail || `HTTP ${res.status}`);
                        }
                        const data = await res.json();
                        if (data.status === 'success' && data.account_id) {
                            addToast('账号创建成功，自动登录中', 'success');
                            accountId.value = data.account_id;
                            localStorage.setItem('tg_gallery_account', data.account_id);
                            await loadGallery();
                        } else {
                            throw new Error('注册响应异常');
                        }
                    } catch (e) {
                        addToast('注册失败: ' + e.message, 'error');
                    } finally {
                        registering.value = false;
                    }
                }

                // ---- 登录 ----
                async function doLogin() {
                    const id = loginInput.value.trim();
                    if (id.length !== 16) {
                        addToast('请输入16位账号', 'warning');
                        return;
                    }
                    accountId.value = id;
                    localStorage.setItem('tg_gallery_account', id);
                    addToast('登录成功', 'success');
                    await loadGallery();
                }

                // ---- 图库 ----
                async function loadGallery() {
                    if (!accountId.value) return;
                    galleryLoading.value = true;
                    try {
                        const res = await fetch(`${API_BASE}/api/images`, {
                            headers: { 'Authorization': `Bearer ${accountId.value}` }
                        });
                        if (!res.ok) {
                            if (res.status === 401 || res.status === 403) {
                                addToast('登录已过期，请重新登录', 'error');
                                logout();
                                return;
                            }
                            throw new Error(`HTTP ${res.status}`);
                        }
                        const data = await res.json();
                        if (data.status === 'success' && Array.isArray(data.images)) {
                            images.value = data.images;
                        } else {
                            images.value = [];
                        }
                    } catch (e) {
                        addToast('加载图库失败: ' + e.message, 'error');
                        images.value = [];
                    } finally {
                        galleryLoading.value = false;
                    }
                }

                function refreshGallery() {
                    loadGallery();
                }

                // ---- 上传（核心修复） ----
                async function startUpload(file) {
                    if (uploading.value) return;
                    if (file.size > 20 * 1024 * 1024) {
                        addToast('图片大小超过 20 MB 限制', 'error');
                        return;
                    }

                    uploading.value = true;
                    uploadProgress.value = 20;
                    uploadStatus.value = '正在流式传输至 Telegram...';

                    const formData = new FormData();
                    formData.append('file', file);

                    // 模拟平滑进度（前端友好）
                    const progressTimer = setInterval(() => {
                        if (uploadProgress.value < 90) {
                            uploadProgress.value += 15;
                        }
                    }, 400);

                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 90000); // 90秒超时

                        const res = await fetch(`${API_BASE}/api/upload`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${accountId.value}`
                            },
                            body: formData,
                            signal: controller.signal
                        });

                        clearTimeout(timeoutId);
                        clearInterval(progressTimer);

                        if (!res.ok) {
                            const errData = await res.json().catch(() => ({}));
                            throw new Error(errData.detail || `HTTP ${res.status}`);
                        }

                        const data = await res.json();
                        if (data.status === 'success') {
                            uploadProgress.value = 100;
                            uploadStatus.value = '上传完成 ✅';
                            addToast(`上传成功: ${data.file_name}`, 'success');
                            await loadGallery();
                        } else {
                            throw new Error(data.detail || '上传未返回成功标记');
                        }
                    } catch (e) {
                        clearInterval(progressTimer);
                        console.error("Upload error:", e);
                        if (e.name === 'AbortError') {
                            addToast('上传超时，请检查网络后重试', 'error');
                        } else {
                            addToast('上传失败: ' + (e.message || '网络连接异常'), 'error');
                        }
                        uploadStatus.value = '上传失败';
                    } finally {
                        setTimeout(() => {
                            uploading.value = false;
                            uploadProgress.value = 0;
                            uploadStatus.value = '';
                        }, 800);
                    }
                }

                // ---- 上传触发 ----
                function triggerFileInput() {
                    if (uploading.value) return;
                    if (fileInputRef.value) fileInputRef.value.click();
                }

                function onFilePicked(e) {
                    const file = e.target.files[0];
                    if (file) startUpload(file);
                    e.target.value = '';
                }

                function handleDrop(e) {
                    isDragging.value = false;
                    const file = e.dataTransfer.files[0];
                    if (file && file.type.startsWith('image/')) {
                        startUpload(file);
                    } else {
                        addToast('请拖拽图片文件', 'warning');
                    }
                }

                // ---- 预览 ----
                function openPreview(img) {
                    previewImage.value = img;
                    previewVisible.value = true;
                    document.body.style.overflow = 'hidden';
                }

                function closePreview() {
                    previewVisible.value = false;
                    previewImage.value = null;
                    document.body.style.overflow = '';
                }

                function copyLink() {
                    if (!previewImage.value) return;
                    const url = previewImage.value.url;
                    navigator.clipboard?.writeText(url).then(() => {
                        addToast('压缩直链已复制', 'success');
                    }).catch(() => {
                        const ta = document.createElement('textarea');
                        ta.value = url;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        ta.style.left = '-9999px';
                        document.body.appendChild(ta);
                        ta.select();
                        try { document.execCommand('copy');
                            addToast('压缩直链已复制', 'success'); } catch (_) { addToast('复制失败，请手动复制', 'error'); }
                        document.body.removeChild(ta);
                    });
                }

                function copyRawLink() {
                    if (!previewImage.value) return;
                    const url = previewImage.value.url + '?raw=true';
                    navigator.clipboard?.writeText(url).then(() => {
                        addToast('原图直链已复制', 'success');
                    }).catch(() => {
                        const ta = document.createElement('textarea');
                        ta.value = url;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        ta.style.left = '-9999px';
                        document.body.appendChild(ta);
                        ta.select();
                        try { document.execCommand('copy');
                            addToast('原图直链已复制', 'success'); } catch (_) { addToast('复制失败，请手动复制', 'error'); }
                        document.body.removeChild(ta);
                    });
                }

                function downloadImage() {
                    if (!previewImage.value) return;
                    const url = previewImage.value.url;
                    const name = previewImage.value.file_name || 'image.jpg';
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    addToast('开始下载', 'info');
                }

                function openInNewTab() {
                    if (!previewImage.value) return;
                    window.open(previewImage.value.url, '_blank');
                }

                function handleImageError(event, img) {
                    event.target.style.display = 'none';
                    const parent = event.target.parentElement;
                    const fallback = document.createElement('div');
                    fallback.style.cssText =
                        'width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--border);color:var(--text-tertiary);font-size:1.6rem;';
                    fallback.innerHTML = '<i class="fas fa-image"></i>';
                    parent.appendChild(fallback);
                }

                // ---- 生命周期 ----
                onMounted(() => {
                    document.documentElement.setAttribute('data-theme', theme.value);
                    if (accountId.value) {
                        loadGallery();
                    }
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && previewVisible.value) {
                            closePreview();
                        }
                    });
                });

                watch(accountId, (val) => {
                    if (!val) {
                        images.value = [];
                        previewVisible.value = false;
                    }
                });

                return {
                    accountId,
                    theme,
                    loginInput,
                    registering,
                    fileInputRef,
                    isDragging,
                    uploading,
                    uploadProgress,
                    uploadStatus,
                    images,
                    galleryLoading,
                    searchQuery,
                    sortBy,
                    filteredImages,
                    totalSize,
                    previewVisible,
                    previewImage,
                    toasts,
                    toggleTheme,
                    copyAccount,
                    logout,
                    doRegister,
                    doLogin,
                    loadGallery,
                    refreshGallery,
                    triggerFileInput,
                    onFilePicked,
                    handleDrop,
                    startUpload,
                    openPreview,
                    closePreview,
                    copyLink,
                    copyRawLink,
                    downloadImage,
                    openInNewTab,
                    handleImageError,
                    formatFileSize,
                    removeToast,
                    addToast,
                };
            }
        });

        app.mount('#app');
    </script>

</body>
</html>
