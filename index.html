                <button class="header-btn" id="themeToggleBtn" title="切换主题" aria-label="切换主题">
                    <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                </button>
            </div>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-nav" role="tablist" aria-label="功能导航">
            <button class="tab-btn active" id="tabUploadBtn" role="tab" aria-selected="true" aria-controls="panel-upload" data-tab="upload">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16l-4-4-4 4M12 12v9"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/><path d="M16 16l-4-4-4 4"/></svg>
                上传处理
            </button>
            <button class="tab-btn" id="tabQueryBtn" role="tab" aria-selected="false" aria-controls="panel-query" data-tab="query">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                查询信息
            </button>
            <button class="tab-btn" id="tabDownloadBtn" role="tab" aria-selected="false" aria-controls="panel-download" data-tab="download">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
                取件下载
            </button>
        </nav>

        <!-- Upload Panel -->
        <section class="tab-panel active" id="panel-upload" role="tabpanel" aria-labelledby="tabUploadBtn">
            <div class="glass-card">
                <div class="card-content">
                    <div class="upload-zone" id="uploadZone" role="button" tabindex="0" aria-label="上传图片文件">
                        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 19V5M5 12l7-7 7 7"/>
                            <path d="M4 19h16"/>
                        </svg>
                        <div class="upload-title">拖拽图片到此处 或 点击上传</div>
                        <div class="upload-subtitle">选择图片后自动清除所有 EXIF / GPS / 设备信息</div>
                        <div class="upload-formats">支持 JPG · PNG · WEBP · TIFF</div>
                        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/tiff,image/*" aria-label="选择图片文件">
                    </div>

                    <img id="previewThumb" class="preview-thumb hidden" alt="图片预览" />

                    <div class="progress-container" id="progressContainer">
                        <div class="progress-label">
                            <span id="progressLabel">处理中...</span>
                            <span class="progress-percent" id="progressPercent">0%</span>
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>

                    <div class="result-section" id="resultSection">
                        <div class="result-box">
                            <div class="result-code" id="resultCode">------</div>
                            <div class="result-info" id="resultInfo"></div>
                            <div class="result-actions" id="resultActions"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Query Panel -->
        <section class="tab-panel" id="panel-query" role="tabpanel" aria-labelledby="tabQueryBtn">
            <div class="glass-card">
                <div class="card-content">
                    <div class="input-group">
                        <input type="text" class="input-code" id="queryCodeInput" placeholder="输入 6 位物件码" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" autocomplete="off" aria-label="物件码输入">
                        <button class="btn btn-primary" id="queryBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                            查询
                        </button>
                    </div>
                    <div id="queryResult" style="margin-top:16px;display:none;"></div>
                    <div id="queryError" style="margin-top:16px;display:none;"></div>
                </div>
            </div>
        </section>

        <!-- Download Panel -->
        <section class="tab-panel" id="panel-download" role="tabpanel" aria-labelledby="tabDownloadBtn">
            <div class="glass-card">
                <div class="card-content">
                    <div class="input-group">
                        <input type="text" class="input-code" id="downloadCodeInput" placeholder="输入 6 位物件码" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" autocomplete="off" aria-label="物件码输入">
                        <button class="btn btn-primary" id="previewBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            预览
                        </button>
                        <button class="btn btn-secondary" id="downloadBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
                            下载
                        </button>
                    </div>
                    <div id="downloadPreview" style="margin-top:16px;display:none;"></div>
                    <div id="downloadError" style="margin-top:16px;display:none;"></div>
                </div>
            </div>
        </section>

        <!-- Mode Explanation -->
        <div class="glass-card" style="margin-top:16px;">
            <div class="mode-explanation" id="modeExplanation">
                <strong>后端处理模式</strong>：图片会上传到服务器，服务器清除元数据后返回 6 位物件码，2 小时内可取件下载。
                <span class="pros">优点：不占本地资源、支持 TIFF 等更多格式。</span>
                <span class="cons">缺点：需联网、图片经过服务器。</span>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <script>
        (function() {
            'use strict';

            // ===== Constants =====
            const API_BASE = 'https://156.246.95.165.nip.io';
            const API_UPLOAD = `${API_BASE}/api/upload`;
            const API_INFO = `${API_BASE}/api/info`;
            const API_DOWNLOAD = `${API_BASE}/api/download`;
            const MAX_FILE_SIZE = 50 * 1024 * 1024;
            const EXPIRE_SECONDS = 7200;
            const MAX_CANVAS_DIMENSION = 4096;
            const PERF_CHECK_INTERVAL = 3000;
            const FRAME_SAMPLE_SIZE = 60;
            const IDB_DB_NAME = 'meta-cleaner-db';
            const IDB_STORE_NAME = 'blobs';

            // ===== State =====
            let currentMode = localStorage.getItem('metaCleanerMode') || 'backend';
            let currentTheme = localStorage.getItem('metaCleanerTheme') || 'light';
            let activeTab = 'upload';
            let uploadedFileName = '';
            let uploadedFileSize = 0;
            let currentObjectUrl = null; // For immediate preview only, not persistent
            let currentPreviewUrl = null; // For preview thumbnail
            let expireTimer = null;
            let perfFrameCount = 0;
            let perfLastTime = performance.now();
            let perfFPS = 60;
            let perfLowFrames = 0;
            let perfMonitorRunning = false;
            let orbCount = 4;
            let isOffline = !navigator.onLine;
            let currentController = null;

            // ===== DOM Elements =====
            const body = document.body;
            const themeToggleBtn = document.getElementById('themeToggleBtn');
            const themeIconSun = document.getElementById('themeIconSun');
            const themeIconMoon = document.getElementById('themeIconMoon');
            const modeToggleBtn = document.getElementById('modeToggleBtn');
            const modeToggleText = document.getElementById('modeToggleText');
            const modeBadge = document.getElementById('modeBadge');
            const modeBadgeText = document.getElementById('modeBadgeText');
            const modeExplanation = document.getElementById('modeExplanation');
            const tabButtons = document.querySelectorAll('.tab-btn');
            const tabPanels = document.querySelectorAll('.tab-panel');
            const uploadZone = document.getElementById('uploadZone');
            const fileInput = document.getElementById('fileInput');
            const previewThumb = document.getElementById('previewThumb');
            const progressContainer = document.getElementById('progressContainer');
            const progressLabel = document.getElementById('progressLabel');
            const progressPercent = document.getElementById('progressPercent');
            const progressFill = document.getElementById('progressFill');
            const resultSection = document.getElementById('resultSection');
            const resultCode = document.getElementById('resultCode');
            const resultInfo = document.getElementById('resultInfo');
            const resultActions = document.getElementById('resultActions');
            const queryCodeInput = document.getElementById('queryCodeInput');
            const queryBtn = document.getElementById('queryBtn');
            const queryResult = document.getElementById('queryResult');
            const queryError = document.getElementById('queryError');
            const downloadCodeInput = document.getElementById('downloadCodeInput');
            const previewBtn = document.getElementById('previewBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const downloadPreview = document.getElementById('downloadPreview');
            const downloadError = document.getElementById('downloadError');
            const toastContainer = document.getElementById('toastContainer');
            const perfBadge = document.getElementById('perfBadge');

            // ===== Icons (SVG strings) =====
            const ICONS = {
                success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
                error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
                warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
                info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
                copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>',
                clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
                file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
                image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3" ry="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
                server: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><circle cx="7" cy="6" r="1" fill="currentColor"/><circle cx="7" cy="18" r="1" fill="currentColor"/></svg>',
                browser: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>',
            };

            // ===== Theme Management =====
            function applyTheme(theme, persist = true) {
                currentTheme = theme;
                if (theme === 'dark') {
                    body.classList.add('dark');
                    themeIconSun.style.display = 'none';
                    themeIconMoon.style.display = 'block';
                } else {
                    body.classList.remove('dark');
                    themeIconSun.style.display = 'block';
                    themeIconMoon.style.display = 'none';
                }
                if (persist) {
                    try { localStorage.setItem('metaCleanerTheme', theme); } catch (e) { /* ignore */ }
                }
            }

            themeToggleBtn.addEventListener('click', () => {
                applyTheme(currentTheme === 'light' ? 'dark' : 'light');
            });

            // ===== Mode Management =====
            function applyMode(mode, persist = true) {
                currentMode = mode;
                if (mode === 'frontend') {
                    modeBadgeText.textContent = '前端处理';
                    modeToggleText.textContent = '切换后端';
                    modeExplanation.innerHTML =
                        '<strong>前端处理模式</strong>：图片在浏览器本地用 Canvas 重新绘制，元数据自动剥离，不上传任何数据到服务器。' +
                        '<span class="pros">优点：完全离线可用、隐私安全、速度极快。</span>' +
                        '<span class="cons">缺点：不支持 TIFF、大图可能卡顿、依赖浏览器能力。</span>';
                    modeBadge.querySelector('svg').outerHTML = ICONS.browser;
                } else {
                    modeBadgeText.textContent = '后端处理';
                    modeToggleText.textContent = '切换前端';
                    modeExplanation.innerHTML =
                        '<strong>后端处理模式</strong>：图片上传到服务器，服务器清除元数据后返回 6 位物件码，2 小时内可取件下载。' +
                        '<span class="pros">优点：不占本地资源、支持 TIFF 等更多格式。</span>' +
                        '<span class="cons">缺点：需联网、图片经过服务器。</span>';
                    modeBadge.querySelector('svg').outerHTML = ICONS.server;
                }
                if (persist) {
                    try { localStorage.setItem('metaCleanerMode', mode); } catch (e) { /* ignore */ }
                }
            }

            modeToggleBtn.addEventListener('click', () => {
                const newMode = currentMode === 'backend' ? 'frontend' : 'backend';
                applyMode(newMode);
                showToast(
                    newMode === 'frontend' ? '已切换到前端处理模式，图片不会离开浏览器' : '已切换到后端处理模式，图片将上传服务器',
                    'info'
                );
                resetUploadResult();
            });

            // ===== Tab Management =====
            function switchTab(tabId) {
                activeTab = tabId;
                tabButtons.forEach(btn => {
                    const isActive = btn.dataset.tab === tabId;
                    btn.classList.toggle('active', isActive);
                    btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
                });
                tabPanels.forEach(panel => {
                    panel.classList.toggle('active', panel.id === `panel-${tabId}`);
                });
            }

            tabButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    switchTab(btn.dataset.tab);
                });
            });

            // ===== Toast System =====
            function showToast(message, type = 'info', duration = 3500) {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = (ICONS[type] || ICONS.info) + `<span>${escapeHtml(message)}</span>`;
                toastContainer.appendChild(toast);
                const removeToast = () => {
                    if (toast.isConnected) {
                        toast.classList.add('removing');
                        setTimeout(() => {
                            if (toast.isConnected) toast.remove();
                        }, 400);
                    }
                };
                toast._removeTimer = setTimeout(removeToast, duration);
                toast.addEventListener('click', () => {
                    clearTimeout(toast._removeTimer);
                    removeToast();
                });
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ===== Progress Bar =====
            function showProgress(label) {
                progressContainer.classList.add('visible');
                progressLabel.textContent = label;
                setProgress(0);
            }

            function setProgress(value) {
                const clamped = Math.max(0, Math.min(100, value));
                progressFill.style.width = clamped + '%';
                progressPercent.textContent = Math.round(clamped) + '%';
            }

            function hideProgress() {
                progressContainer.classList.remove('visible');
                setProgress(0);
            }

            // ===== Upload Result =====
            function resetUploadResult() {
                resultSection.classList.remove('visible');
                previewThumb.classList.add('hidden');
                previewThumb.src = '';
                if (currentPreviewUrl) {
                    URL.revokeObjectURL(currentPreviewUrl);
                    currentPreviewUrl = null;
                }
                if (currentObjectUrl) {
                    URL.revokeObjectURL(currentObjectUrl);
                    currentObjectUrl = null;
                }
                if (expireTimer) {
                    clearInterval(expireTimer);
                    expireTimer = null;
                }
            }

            function showUploadResult(code, filename, expiresInSeconds, extraActions) {
                resultSection.classList.add('visible');
                resultCode.textContent = code;
                resultInfo.innerHTML = '';

                const fileNameSpan = document.createElement('span');
                fileNameSpan.innerHTML = ICONS.file + ` <span>${escapeHtml(filename)}</span>`;
                resultInfo.appendChild(fileNameSpan);

                if (expiresInSeconds !== undefined && expiresInSeconds !== null) {
                    const expirySpan = document.createElement('span');
                    expirySpan.id = 'expiryCountdown';
                    expirySpan.innerHTML = ICONS.clock + ` <span>剩余 ${formatTime(expiresInSeconds)}</span>`;
                    resultInfo.appendChild(expirySpan);
                    startExpiryCountdown(expiresInSeconds, expirySpan);
                }

                resultActions.innerHTML = '';
                if (extraActions) {
                    extraActions.forEach(action => {
                        const btn = document.createElement('button');
                        btn.className = `btn ${action.className || 'btn-secondary'}`;
                        btn.innerHTML = (action.icon || '') + (action.label || '');
                        btn.addEventListener('click', action.onClick);
                        resultActions.appendChild(btn);
                    });
                }
            }

            function startExpiryCountdown(seconds, element) {
                if (expireTimer) clearInterval(expireTimer);
                let remaining = seconds;
                expireTimer = setInterval(() => {
                    remaining--;
                    if (remaining <= 0) {
                        clearInterval(expireTimer);
                        expireTimer = null;
                        element.innerHTML = ICONS.clock + ' <span>已过期</span>';
                    } else {
                        element.innerHTML = ICONS.clock + ` <span>剩余 ${formatTime(remaining)}</span>`;
                    }
                }, 1000);
            }

            function formatTime(seconds) {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = Math.floor(seconds % 60);
                if (h > 0) return `${h}时${m}分${s}秒`;
                if (m > 0) return `${m}分${s}秒`;
                return `${s}秒`;
            }

            // ===== IndexedDB Helper (for frontend blob persistence) =====
            let dbPromise = null;

            function openIDB() {
                if (!dbPromise) {
                    dbPromise = new Promise((resolve, reject) => {
                        if (!('indexedDB' in window)) {
                            reject(new Error('当前浏览器不支持 IndexedDB，前端物件码将无法持久化'));
                            return;
                        }
                        const request = indexedDB.open(IDB_DB_NAME, 1);
                        request.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains(IDB_STORE_NAME)) {
                                db.createObjectStore(IDB_STORE_NAME, { keyPath: 'code' });
                            }
                        };
                        request.onsuccess = (e) => resolve(e.target.result);
                        request.onerror = (e) => reject(e.target.error);
                    });
                }
                return dbPromise;
            }

            async function storeBlobInIDB(code, blob) {
                try {
                    const db = await openIDB();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction(IDB_STORE_NAME, 'readwrite');
                        const store = tx.objectStore(IDB_STORE_NAME);
                        store.put({ code, blob, timestamp: Date.now() });
                        tx.oncomplete = () => resolve();
                        tx.onerror = (e) => reject(e.target.error);
                    });
                } catch (err) {
                    console.warn('IndexedDB 存储失败:', err);
                    throw err;
                }
            }

            async function getBlobFromIDB(code) {
                try {
                    const db = await openIDB();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction(IDB_STORE_NAME, 'readonly');
                        const store = tx.objectStore(IDB_STORE_NAME);
                        const request = store.get(code);
                        request.onsuccess = () => {
                            const result = request.result;
                            if (result && result.blob) {
                                resolve(result.blob);
                            } else {
                                resolve(null);
                            }
                        };
                        request.onerror = (e) => reject(e.target.error);
                    });
                } catch (err) {
                    console.warn('IndexedDB 读取失败:', err);
                    return null;
                }
            }

            async function deleteBlobFromIDB(code) {
                try {
                    const db = await openIDB();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction(IDB_STORE_NAME, 'readwrite');
                        const store = tx.objectStore(IDB_STORE_NAME);
                        store.delete(code);
                        tx.oncomplete = () => resolve();
                        tx.onerror = (e) => reject(e.target.error);
                    });
                } catch (err) {
                    console.warn('IndexedDB 删除失败:', err);
                }
            }

            async function cleanupExpiredIDB() {
                try {
                    const db = await openIDB();
                    const tx = db.transaction(IDB_STORE_NAME, 'readwrite');
                    const store = tx.objectStore(IDB_STORE_NAME);
                    const request = store.openCursor();
                    request.onsuccess = (event) => {
                        const cursor = event.target.result;
                        if (cursor) {
                            const record = cursor.value;
                            const code = record.code;
                            const localData = getLocalCodeData(code);
                            if (!localData || Date.now() > localData.expiresAt) {
                                store.delete(code);
                                // Also remove from localStorage if not already
                                removeLocalCode(code);
                            }
                            cursor.continue();
                        }
                    };
                } catch (e) {
                    console.warn('IndexedDB 清理失败:', e);
                }
            }

            // ===== Backend Processing =====
            async function processBackend(file) {
                if (currentController) currentController.abort();
                currentController = new AbortController();
                const formData = new FormData();
                formData.append('file', file);

                showProgress('上传图片中...');
                setProgress(0);

                try {
                    const result = await new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', API_UPLOAD, true);
                        xhr.responseType = 'json';
                        xhr.timeout = 120000;

                        xhr.upload.addEventListener('progress', (e) => {
                            if (e.lengthComputable) {
                                const percent = (e.loaded / e.total) * 100;
                                setProgress(percent * 0.85);
                                progressLabel.textContent = '上传中...';
                            }
                        });

                        xhr.upload.addEventListener('load', () => {
                            setProgress(88);
                            progressLabel.textContent = '服务器处理中...';
                        });

                        xhr.addEventListener('load', () => {
                            if (xhr.status >= 200 && xhr.status < 300) {
                                setProgress(100);
                                progressLabel.textContent = '完成！';
                                resolve(xhr.response);
                            } else {
                                let errorMsg = `上传失败 (${xhr.status})`;
                                try {
                                    const data = xhr.response;
                                    if (data && data.detail) errorMsg = data.detail;
                                } catch (e) { /* ignore */ }
                                reject(new Error(errorMsg));
                            }
                        });

                        xhr.addEventListener('error', () => reject(new Error('网络错误，请检查连接')));
                        xhr.addEventListener('timeout', () => reject(new Error('上传超时，请重试')));
                        xhr.addEventListener('abort', () => reject(new Error('上传已取消')));

                        xhr.send(formData);
                        currentController._xhr = xhr;
                        currentController.signal.addEventListener('abort', () => {
                            try { xhr.abort(); } catch (e) { /* ignore */ }
                        });
                    });

                    if (result && result.success && result.code) {
                        uploadedFileName = result.filename || file.name;
                        const expiresIn = result.expires_in_seconds || EXPIRE_SECONDS;
                        showUploadResult(result.code, uploadedFileName, expiresIn, [
                            {
                                label: '复制物件码',
                                icon: ICONS.copy,
                                className: 'btn-secondary',
                                onClick: () => copyText(result.code)
                            },
                            {
                                label: '预览图片',
                                icon: ICONS.image,
                                className: 'btn-primary',
                                onClick: () => openDownloadPreview(result.code)
                            },
                            {
                                label: '下载图片',
                                icon: ICONS.success,
                                className: 'btn-primary',
                                onClick: () => triggerDownload(result.code)
                            }
                        ]);
                        showToast('上传成功，物件码 ' + result.code, 'success');
                    } else {
                        throw new Error('服务器返回异常');
                    }
                } catch (err) {
                    if (err.name === 'AbortError' || err.message === '上传已取消') {
                        showToast('上传已取消', 'warning');
                    } else {
                        showToast(err.message || '上传失败', 'error');
                        showUploadError(err.message || '上传失败');
                    }
                } finally {
                    setTimeout(() => {
                        if (progressFill.style.width === '100%') hideProgress();
                    }, 800);
                    currentController = null;
                }
            }

            function showUploadError(message) {
                resultSection.classList.add('visible');
                resultCode.textContent = 'ERROR';
                resultInfo.innerHTML = '';
                const errSpan = document.createElement('span');
                errSpan.innerHTML = ICONS.error + ` <span>${escapeHtml(message)}</span>`;
                resultInfo.appendChild(errSpan);
                resultActions.innerHTML = '';
            }

            // ===== Frontend Processing (with transparency preservation and IDB storage) =====
            async function processFrontend(file) {
                showProgress('正在读取图片...');
                setProgress(5);

                try {
                    const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
                    if (!validTypes.includes(file.type)) {
                        throw new Error('前端处理仅支持 JPG、PNG、WEBP。TIFF 请切换后端模式。');
                    }
                    if (file.size > MAX_FILE_SIZE) {
                        throw new Error('文件超过 50MB 限制');
                    }

                    const arrayBuffer = await file.arrayBuffer();
                    setProgress(20);
                    progressLabel.textContent = '解码图片...';

                    let bitmap;
                    try {
                        bitmap = await createImageBitmap(new Blob([arrayBuffer], { type: file.type }));
                    } catch (e) {
                        bitmap = await loadImageFallback(URL.createObjectURL(new Blob([arrayBuffer], { type: file
                            .type })));
                    }
                    setProgress(45);
                    progressLabel.textContent = '清除元数据中...';

                    let width = bitmap.width;
                    let height = bitmap.height;
                    const originalWidth = width;
                    const originalHeight = height;

                    if (width > MAX_CANVAS_DIMENSION || height > MAX_CANVAS_DIMENSION) {
                        const scale = Math.min(MAX_CANVAS_DIMENSION / width, MAX_CANVAS_DIMENSION / height);
                        width = Math.round(width * scale);
                        height = Math.round(height * scale);
                    }

                    // Determine if we need to preserve transparency
                    const isJPEG = file.type === 'image/jpeg';
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d', { alpha: !isJPEG }); // For JPEG use opaque, for PNG/WEBP keep alpha
                    
                    // For JPEG, fill white background to avoid black corners
                    if (isJPEG) {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, width, height);
                    } else {
                        // For PNG/WEBP, don't fill, preserve transparency
                    }

                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(bitmap, 0, 0, width, height);

                    setProgress(65);
                    progressLabel.textContent = '生成无元数据图片...';

                    if (bitmap.close) bitmap.close();

                    const blob = await new Promise((resolve, reject) => {
                        canvas.toBlob((blob) => {
                            if (blob) resolve(blob);
                            else reject(new Error('图片导出失败'));
                        }, file.type || 'image/png', 0.92);
                    });

                    setProgress(85);
                    progressLabel.textContent = '创建本地物件码...';

                    const localCode = generateLocalCode();
                    const blobUrl = URL.createObjectURL(blob);
                    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
                    currentObjectUrl = blobUrl;

                    // Store blob in IndexedDB for persistence
                    try {
                        await storeBlobInIDB(localCode, blob);
                    } catch (e) {
                        console.warn('IndexedDB 存储失败，物件码将仅在本页面有效', e);
                    }

                    // Store metadata in localStorage
                    try {
                        const storeKey = `metaCleanerLocal_${localCode}`;
                        localStorage.setItem(storeKey, JSON.stringify({
                            code: localCode,
                            filename: file.name,
                            size: blob.size,
                            createdAt: Date.now(),
                            expiresAt: Date.now() + EXPIRE_SECONDS * 1000,
                            blobSize: blob.size
                        }));
                    } catch (e) { /* localStorage may be full */ }

                    setProgress(100);
                    progressLabel.textContent = '完成！';

                    uploadedFileName = file.name;
                    const expiresIn = EXPIRE_SECONDS;

                    showUploadResult(localCode, file.name, expiresIn, [
                        {
                            label: '复制物件码',
                            icon: ICONS.copy,
                            className: 'btn-secondary',
                            onClick: () => copyText(localCode)
                        },
                        {
                            label: '下载图片',
                            icon: ICONS.success,
                            className: 'btn-primary',
                            onClick: () => downloadFrontendBlob(localCode, file.name)
                        },
                        {
                            label: '预览图片',
                            icon: ICONS.image,
                            className: 'btn-secondary',
                            onClick: () => previewFrontendBlob(localCode)
                        }
                    ]);

                    if (currentPreviewUrl) URL.revokeObjectURL(currentPreviewUrl);
                    currentPreviewUrl = blobUrl;
                    previewThumb.src = blobUrl;
                    previewThumb.classList.remove('hidden');

                    showToast('前端处理完成，图片未离开浏览器', 'success');

                    canvas.width = 0;
                    canvas.height = 0;

                } catch (err) {
                    showToast(err.message || '前端处理失败', 'error');
                    showUploadError(err.message || '前端处理失败');
                } finally {
                    setTimeout(() => {
                        if (progressFill.style.width === '100%') hideProgress();
                    }, 800);
                }
            }

            function loadImageFallback(url) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        URL.revokeObjectURL(url); // Revoke after load
                        resolve(img);
                    };
                    img.onerror = () => {
                        URL.revokeObjectURL(url);
                        reject(new Error('图片解码失败'));
                    };
                    img.src = url;
                });
            }

            function generateLocalCode() {
                const stored = [];
                try {
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key && key.startsWith('metaCleanerLocal_')) {
                            stored.push(key.replace('metaCleanerLocal_', ''));
                        }
                    }
                } catch (e) { /* ignore */ }
                let code;
                do {
                    code = String(Math.floor(100000 + Math.random() * 900000));
                } while (stored.includes(code));
                return code;
            }

            async function downloadFrontendBlob(code, filename) {
                try {
                    // First try in-memory URL if available and not expired
                    const localData = getLocalCodeData(code);
                    if (!localData) {
                        showToast('物件码不存在或已过期', 'error');
                        return;
                    }
                    const remaining = EXPIRE_SECONDS - Math.floor((Date.now() - localData.createdAt) / 1000);
                    if (remaining <= 0) {
                        removeLocalCode(code);
                        await deleteBlobFromIDB(code);
                        showToast('物件码已过期', 'error');
                        return;
                    }

                    // Get blob from IndexedDB
                    const blob = await getBlobFromIDB(code);
                    if (!blob) {
                        showToast('图片数据已失效，请重新上传', 'error');
                        return;
                    }

                    const a = document.createElement('a');
                    const ext = filename.split('.').pop() || 'jpg';
                    const cleanName = filename.replace(/\.[^.]+$/, '') + '_cleaned.' + ext;
                    const url = URL.createObjectURL(blob);
                    a.href = url;
                    a.download = cleanName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                    showToast('下载已开始', 'success');
                } catch (err) {
                    console.error('下载失败:', err);
                    showToast('下载失败，请重试', 'error');
                }
            }

            async function previewFrontendBlob(code) {
                try {
                    const localData = getLocalCodeData(code);
                    if (!localData) {
                        showToast('物件码不存在或已过期', 'error');
                        return;
                    }
                    const remaining = EXPIRE_SECONDS - Math.floor((Date.now() - localData.createdAt) / 1000);
                    if (remaining <= 0) {
                        removeLocalCode(code);
                        await deleteBlobFromIDB(code);
                        showToast('物件码已过期', 'error');
                        return;
                    }

                    const blob = await getBlobFromIDB(code);
                    if (!blob) {
                        showToast('图片数据已失效，请重新上传', 'error');
                        return;
                    }

                    const url = URL.createObjectURL(blob);
                    const win = window.open();
                    if (win) {
                        win.document.write(
                            `<title>预览 - ${escapeHtml(localData.filename || '图片')}</title><body style="margin:0;display:flex;align-items:center;justify-content:center;background:#0a0a1a;min-height:100vh;"><img src="${url}" alt="预览" style="max-width:100%;max-height:100vh;object-fit:contain;"></body>`
                        );
                    } else {
                        window.location.href = url;
                    }
                    setTimeout(() => URL.revokeObjectURL(url), 60000);
                } catch (err) {
                    console.error('预览失败:', err);
                    showToast('预览失败，请重试', 'error');
                }
            }

            // ===== Upload Zone Events =====
            uploadZone.addEventListener('click', (e) => {
                if (e.target !== fileInput) fileInput.click();
            });
            uploadZone.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    fileInput.click();
                }
            });

            fileInput.addEventListener('change', () => {
                if (fileInput.files && fileInput.files.length > 0) {
                    handleFile(fileInput.files[0]);
                }
            });

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                uploadZone.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            uploadZone.addEventListener('dragenter', () => uploadZone.classList.add('dragover'));
            uploadZone.addEventListener('dragover', () => uploadZone.classList.add('dragover'));
            uploadZone.addEventListener('dragleave', (e) => {
                if (!uploadZone.contains(e.relatedTarget)) uploadZone.classList.remove('dragover');
            });
            uploadZone.addEventListener('drop', (e) => {
                uploadZone.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) handleFile(files[0]);
            });

            document.addEventListener('paste', (e) => {
                if (activeTab !== 'upload') return;
                const items = e.clipboardData && e.clipboardData.items;
                if (items) {
                    for (const item of items) {
                        if (item.type.startsWith('image/')) {
                            const file = item.getAsFile();
                            if (file) {
                                handleFile(file);
                                e.preventDefault();
                                break;
                            }
                        }
                    }
                }
            });

            async function handleFile(file) {
                resetUploadResult();
                uploadedFileName = file.name;
                uploadedFileSize = file.size;

                const validTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/tiff', 'image/gif', 'image/bmp'];
                if (!file.type.startsWith('image/') && !validTypes.includes(file.type)) {
                    showToast('不支持的图片格式', 'error');
                    return;
                }
                if (file.size > MAX_FILE_SIZE) {
                    showToast('文件超过 50MB 限制', 'error');
                    return;
                }
                if (file.size === 0) {
                    showToast('文件为空', 'error');
                    return;
                }

                if (file.type !== 'image/tiff') {
                    const previewUrl = URL.createObjectURL(file);
                    if (currentPreviewUrl) URL.revokeObjectURL(currentPreviewUrl);
                    currentPreviewUrl = previewUrl;
                    previewThumb.src = previewUrl;
                    previewThumb.classList.remove('hidden');
                } else {
                    previewThumb.classList.add('hidden');
                }

                if (currentMode === 'frontend') {
                    await processFrontend(file);
                } else {
                    await processBackend(file);
                }
            }

            // ===== Query Functions =====
            queryBtn.addEventListener('click', async () => {
                const code = queryCodeInput.value.trim();
                if (!/^\d{6}$/.test(code)) {
                    showToast('请输入 6 位纯数字物件码', 'warning');
                    queryError.style.display = 'block';
                    queryError.innerHTML =
                        `<div class="info-card" style="border-color:rgba(239,68,68,0.4);">${ICONS.error} <span>请输入 6 位纯数字物件码</span></div>`;
                    queryResult.style.display = 'none';
                    return;
                }
                await performQuery(code);
            });

            queryCodeInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') queryBtn.click();
            });
            queryCodeInput.addEventListener('input', () => {
                queryCodeInput.value = queryCodeInput.value.replace(/\D/g, '').slice(0, 6);
                queryError.style.display = 'none';
                queryResult.style.display = 'none';
            });

            async function performQuery(code) {
                queryResult.style.display = 'none';
                queryError.style.display = 'none';
                queryBtn.disabled = true;
                queryBtn.innerHTML = '<span class="spinner spinner-sm"></span> 查询中...';

                try {
                    const localData = getLocalCodeData(code);
                    if (localData) {
                        const elapsed = Date.now() - localData.createdAt;
                        const remaining = Math.max(0, EXPIRE_SECONDS - Math.floor(elapsed / 1000));
                        if (remaining <= 0) {
                            removeLocalCode(code);
                            await deleteBlobFromIDB(code);
                            throw new Error('物件码已过期');
                        }
                        queryResult.style.display = 'block';
                        queryResult.innerHTML = `
                            <div class="info-card">
                                <div class="info-row">
                                    <span class="info-label">${ICONS.file} 文件名</span>
                                    <span class="info-value">${escapeHtml(localData.filename)}</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">${ICONS.clock} 剩余时间</span>
                                    <span class="info-value">${formatTime(remaining)}</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">${ICONS.server} 处理方式</span>
                                    <span class="info-value">前端本地处理</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">${ICONS.info} 物件码</span>
                                    <span class="info-value">${code}</span>
                                </div>
                            </div>`;
                        showToast('查询成功', 'success');
                        return;
                    }

                    // Backend query
                    const response = await fetch(`${API_INFO}/${code}`, {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' },
                        signal: AbortSignal.timeout(10000)
                    });

                    if (response.ok) {
                        const data = await response.json();
                        if (data.success) {
                            queryResult.style.display = 'block';
                            queryResult.innerHTML = `
                                <div class="info-card">
                                    <div class="info-row">
                                        <span class="info-label">${ICONS.file} 文件名</span>
                                        <span class="info-value">${escapeHtml(data.filename || '未知')}</span>
                                    </div>
                                    <div class="info-row">
                                        <span class="info-label">${ICONS.clock} 剩余时间</span>
                                        <span class="info-value">${formatTime(data.remaining_seconds || 0)}</span>
                                    </div>
                                    <div class="info-row">
                                        <span class="info-label">${ICONS.server} 处理方式</span>
                                        <span class="info-value">后端服务器处理</span>
                                    </div>
                                    <div class="info-row">
                                        <span class="info-label">${ICONS.info} 物件码</span>
                                        <span class="info-value">${code}</span>
                                    </div>
                                </div>`;
                            showToast('查询成功', 'success');
                        } else {
                            throw new Error('查询失败');
                        }
                    } else if (response.status === 404) {
                        throw new Error('物件码不存在或已过期');
                    } else {
                        throw new Error(`查询失败 (${response.status})`);
                    }
                } catch (err) {
                    queryError.style.display = 'block';
                    queryError.innerHTML =
                        `<div class="info-card" style="border-color:rgba(239,68,68,0.4);">${ICONS.error} <span>${escapeHtml(err.message || '查询失败')}</span></div>`;
                    showToast(err.message || '查询失败', 'error');
                } finally {
                    queryBtn.disabled = false;
                    queryBtn.innerHTML = `${ICONS.info} 查询`;
                }
            }

            function getLocalCodeData(code) {
                try {
                    const data = localStorage.getItem(`metaCleanerLocal_${code}`);
                    return data ? JSON.parse(data) : null;
                } catch (e) { return null; }
            }

            function removeLocalCode(code) {
                try {
                    localStorage.removeItem(`metaCleanerLocal_${code}`);
                } catch (e) { /* ignore */ }
            }

            // ===== Download Functions =====
            downloadBtn.addEventListener('click', () => {
                const code = downloadCodeInput.value.trim();
                if (!/^\d{6}$/.test(code)) {
                    showToast('请输入 6 位纯数字物件码', 'warning');
                    downloadError.style.display = 'block';
                    downloadError.innerHTML =
                        `<div class="info-card" style="border-color:rgba(239,68,68,0.4);">${ICONS.error} <span>请输入 6 位纯数字物件码</span></div>`;
                    downloadPreview.style.display = 'none';
                    return;
                }
                triggerDownload(code);
            });

            previewBtn.addEventListener('click', () => {
                const code = downloadCodeInput.value.trim();
                if (!/^\d{6}$/.test(code)) {
                    showToast('请输入 6 位纯数字物件码', 'warning');
                    downloadError.style.display = 'block';
                    downloadError.innerHTML =
                        `<div class="info-card" style="border-color:rgba(239,68,68,0.4);">${ICONS.error} <span>请输入 6 位纯数字物件码</span></div>`;
                    downloadPreview.style.display = 'none';
                    return;
                }
                openDownloadPreview(code);
            });

            downloadCodeInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') triggerDownload(downloadCodeInput.value.trim());
            });
            downloadCodeInput.addEventListener('input', () => {
                downloadCodeInput.value = downloadCodeInput.value.replace(/\D/g, '').slice(0, 6);
                downloadError.style.display = 'none';
                downloadPreview.style.display = 'none';
            });

            async function triggerDownload(code) {
                const localData = getLocalCodeData(code);
                if (localData) {
                    const remaining = EXPIRE_SECONDS - Math.floor((Date.now() - localData.createdAt) / 1000);
                    if (remaining <= 0) {
                        removeLocalCode(code);
                        await deleteBlobFromIDB(code);
                        showToast('本地物件码已过期', 'error');
                        return;
                    }
                    await downloadFrontendBlob(code, localData.filename);
                    return;
                }
                // Backend download
                window.location.href = `${API_DOWNLOAD}/${code}`;
                showToast('下载已触发，请查看浏览器下载', 'success');
            }

            async function openDownloadPreview(code) {
                const localData = getLocalCodeData(code);
                if (localData) {
                    const remaining = EXPIRE_SECONDS - Math.floor((Date.now() - localData.createdAt) / 1000);
                    if (remaining <= 0) {
                        removeLocalCode(code);
                        await deleteBlobFromIDB(code);
                        showToast('本地物件码已过期', 'error');
                        return;
                    }
                    downloadPreview.style.display = 'block';
                    downloadPreview.innerHTML = `<div class="info-card" style="text-align:center;">${ICONS.image} <span>本地图片预览：</span><br><img src="${currentObjectUrl || ''}" alt="本地预览" style="max-width:100%;max-height:300px;border-radius:12px;margin-top:8px;"></div>`;
                    downloadError.style.display = 'none';
                    // If currentObjectUrl is not available (page reload), try loading from IDB
                    if (!currentObjectUrl) {
                        const blob = await getBlobFromIDB(code);
                        if (blob) {
                            const url = URL.createObjectURL(blob);
                            downloadPreview.innerHTML = `<div class="info-card" style="text-align:center;">${ICONS.image} <span>本地图片预览：</span><br><img src="${url}" alt="本地预览" style="max-width:100%;max-height:300px;border-radius:12px;margin-top:8px;"></div>`;
                            setTimeout(() => URL.revokeObjectURL(url), 30000);
                        } else {
                            downloadPreview.innerHTML = `<div class="info-card" style="border-color:rgba(239,68,68,0.4);">${ICONS.error} <span>图片数据丢失，请重新上传</span></div>`;
                        }
                    }
                    return;
                }
                // Backend preview
                downloadPreview.style.display = 'block';
                downloadPreview.innerHTML = `<div class="info-card" style="text-align:center;"><span class="spinner spinner-dark"></span> 加载预览中...</div>`;
                downloadError.style.display = 'none';

                const img = new Image();
                img.onload = () => {
                    downloadPreview.innerHTML = `<div class="info-card" style="text-align:center;">${ICONS.image} <span>图片预览：</span><br><img src="${API_DOWNLOAD}/${code}" alt="预览" style="max-width:100%;max-height:300px;border-radius:12px;margin-top:8px;"></div>`;
                };
                img.onerror = () => {
                    downloadPreview.style.display = 'none';
                    downloadError.style.display = 'block';
                    downloadError.innerHTML = `<div class="info-card" style="border-color:rgba(239,68,68,0.4);">${ICONS.error} <span>预览失败，物件码可能已过期</span></div>`;
                    showToast('预览失败，物件码可能已过期', 'error');
                };
                img.src = `${API_DOWNLOAD}/${code}?t=${Date.now()}`;
            }

            // ===== Copy Text =====
            async function copyText(text) {
                try {
                    await navigator.clipboard.writeText(text);
                    showToast('已复制到剪贴板', 'success');
                } catch (e) {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    try {
                        document.execCommand('copy');
                        showToast('已复制到剪贴板', 'success');
                    } catch (err) {
                        showToast('复制失败，请手动复制', 'warning');
                    }
                    document.body.removeChild(textarea);
                }
            }

            // ===== Performance Monitor (Frame Generation) =====
            function startPerfMonitor() {
                if (perfMonitorRunning) return;
                perfMonitorRunning = true;
                perfFrameCount = 0;
                perfLastTime = performance.now();
                perfFPS = 60;
                perfLowFrames = 0;

                function checkPerf() {
                    const now = performance.now();
                    const delta = now - perfLastTime;
                    if (delta >= PERF_CHECK_INTERVAL) {
                        perfFPS = (perfFrameCount * 1000) / delta;
                        perfFrameCount = 0;
                        perfLastTime = now;

                        if (perfFPS < 30) {
                            perfLowFrames++;
                            if (perfLowFrames >= 3 && orbCount > 2) {
                                orbCount--;
                                applyOrbCount(orbCount);
                                perfLowFrames = 0;
                                if (perfBadge) {
                                    perfBadge.textContent = `性能优化: ${orbCount} 光斑 · ${Math.round(perfFPS)} FPS`;
                                    perfBadge.classList.add('visible');
                                    setTimeout(() => {
                                        if (perfFPS > 40) perfBadge.classList.remove('visible');
                                    }, 3000);
                                }
                            }
                        } else if (perfFPS > 50) {
                            perfLowFrames = 0;
                            if (orbCount < 4) {
                                orbCount++;
                                applyOrbCount(orbCount);
                            }
                        }
                    }
                    perfFrameCount++;
                    requestAnimationFrame(checkPerf);
                }
                requestAnimationFrame(checkPerf);
            }

            function applyOrbCount(count) {
                const orbs = document.querySelectorAll('.bg-orb');
                orbs.forEach((orb, index) => {
                    orb.style.display = index < count ? 'block' : 'none';
                });
            }

            // ===== Network Status =====
            function updateNetworkStatus() {
                isOffline = !navigator.onLine;
                if (isOffline) {
                    showToast('网络已断开，前端处理模式仍可用', 'warning');
                }
            }
            window.addEventListener('online', () => {
                isOffline = false;
                showToast('网络已恢复', 'success');
            });
            window.addEventListener('offline', () => {
                isOffline = true;
                showToast('网络已断开，前端处理模式仍可用', 'warning');
            });

            // ===== Cleanup Local Expired Codes =====
            function cleanupExpiredLocalCodes() {
                try {
                    const keys = [];
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key && key.startsWith('metaCleanerLocal_')) {
                            keys.push(key);
                        }
                    }
                    keys.forEach(key => {
                        try {
                            const data = JSON.parse(localStorage.getItem(key));
                            if (data && data.expiresAt && Date.now() > data.expiresAt) {
                                localStorage.removeItem(key);
                                const code = key.replace('metaCleanerLocal_', '');
                                deleteBlobFromIDB(code);
                            }
                        } catch (e) {
                            localStorage.removeItem(key);
                        }
                    });
                } catch (e) { /* ignore */ }
                cleanupExpiredIDB();
            }

            // ===== Memory Management =====
            function cleanupMemory() {
                if (currentPreviewUrl && !previewThumb.src.includes(currentPreviewUrl)) {
                    URL.revokeObjectURL(currentPreviewUrl);
                    currentPreviewUrl = null;
                }
                cleanupExpiredLocalCodes();
            }

            const memoryCleanupInterval = setInterval(cleanupMemory, 60000);

            // ===== Initialization =====
            function init() {
                applyTheme(currentTheme, false);
                applyMode(currentMode, false);
                applyOrbCount(orbCount);
                startPerfMonitor();
                updateNetworkStatus();
                cleanupExpiredLocalCodes();

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        cleanupMemory();
                    }
                });

                window.addEventListener('beforeunload', () => {
                    if (currentPreviewUrl) URL.revokeObjectURL(currentPreviewUrl);
                    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
                    if (expireTimer) clearInterval(expireTimer);
                    clearInterval(memoryCleanupInterval);
                    if (currentController) {
                        try { currentController.abort(); } catch (e) { /* ignore */ }
                    }
                });

                console.log('[Init] 元数据清除器已加载');
                console.log(`[Init] 模式: ${currentMode} | 主题: ${currentTheme}`);
                console.log('[Init] Service Worker 已移除，离线支持由前端模式提供');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
