<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fdfcff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1b1f" media="(prefers-color-scheme: dark)">
    <title>元数据清除器 · Material 3</title>
    <style>
        :root {
            --m3-primary: #6750a4;
            --m3-on-primary: #ffffff;
            --m3-primary-container: #eaddff;
            --m3-on-primary-container: #21005e;
            --m3-secondary: #625b71;
            --m3-on-secondary: #ffffff;
            --m3-secondary-container: #e8def8;
            --m3-on-secondary-container: #1d192b;
            --m3-tertiary: #7d5260;
            --m3-on-tertiary: #ffffff;
            --m3-tertiary-container: #ffd8e4;
            --m3-on-tertiary-container: #31111d;
            --m3-error: #ba1a1a;
            --m3-on-error: #ffffff;
            --m3-error-container: #ffdad6;
            --m3-on-error-container: #410002;
            --m3-surface: #fdfcff;
            --m3-on-surface: #1c1b1f;
            --m3-surface-variant: #e7e0ec;
            --m3-on-surface-variant: #49454f;
            --m3-surface-container-lowest: #ffffff;
            --m3-surface-container-low: #f7f2fa;
            --m3-surface-container: #f3edf7;
            --m3-surface-container-high: #ece6f0;
            --m3-surface-container-highest: #e6e0e9;
            --m3-outline: #79747e;
            --m3-outline-variant: #cac4d0;
            --m3-shadow: rgba(0, 0, 0, 0.15);
            --m3-shadow-strong: rgba(0, 0, 0, 0.25);
            --m3-radius-xl: 28px;
            --m3-radius-lg: 20px;
            --m3-radius-md: 16px;
            --m3-radius-sm: 12px;
            --m3-radius-xs: 8px;
            --m3-transition: cubic-bezier(0.2, 0, 0, 1);
            --m3-state-hover-opacity: 0.08;
            --m3-state-focus-opacity: 0.12;
            --m3-state-pressed-opacity: 0.16;
            --m3-elevation-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
            --m3-elevation-2: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px 2px rgba(0, 0, 0, 0.15);
            --m3-elevation-3: 0 4px 8px 3px rgba(0, 0, 0, 0.15), 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        [data-theme="dark"] {
            --m3-primary: #d0bcff;
            --m3-on-primary: #381e72;
            --m3-primary-container: #4f378b;
            --m3-on-primary-container: #eaddff;
            --m3-secondary: #ccc2dc;
            --m3-on-secondary: #332d41;
            --m3-secondary-container: #4a4458;
            --m3-on-secondary-container: #e8def8;
            --m3-tertiary: #efb8c8;
            --m3-on-tertiary: #492532;
            --m3-tertiary-container: #633b48;
            --m3-on-tertiary-container: #ffd8e4;
            --m3-error: #f2b8b5;
            --m3-on-error: #601410;
            --m3-error-container: #8c1d18;
            --m3-on-error-container: #f9dedc;
            --m3-surface: #1c1b1f;
            --m3-on-surface: #e6e1e5;
            --m3-surface-variant: #49454f;
            --m3-on-surface-variant: #cac4d0;
            --m3-surface-container-lowest: #0f0d13;
            --m3-surface-container-low: #1d1b20;
            --m3-surface-container: #211f26;
            --m3-surface-container-high: #2b2930;
            --m3-surface-container-highest: #36343b;
            --m3-outline: #938f99;
            --m3-outline-variant: #49454f;
            --m3-shadow: rgba(0, 0, 0, 0.45);
            --m3-shadow-strong: rgba(0, 0, 0, 0.6);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Roboto', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--m3-surface);
            color: var(--m3-on-surface);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s var(--m3-transition), color 0.3s var(--m3-transition);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .m3-card {
            background: var(--m3-surface-container);
            border-radius: var(--m3-radius-lg);
            box-shadow: var(--m3-elevation-2);
            transition: background 0.3s var(--m3-transition), box-shadow 0.3s var(--m3-transition);
            overflow: hidden;
        }
        .m3-card-outlined {
            background: var(--m3-surface-container-low);
            border: 1px solid var(--m3-outline-variant);
            border-radius: var(--m3-radius-lg);
            transition: background 0.3s var(--m3-transition), border-color 0.3s var(--m3-transition);
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            gap: 12px;
            flex-wrap: wrap;
            background: var(--m3-surface-container);
            border-radius: var(--m3-radius-lg);
            margin-bottom: 16px;
            box-shadow: var(--m3-elevation-1);
        }
        .app-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            font-size: 1.25rem;
            letter-spacing: -0.01em;
            color: var(--m3-on-surface);
            user-select: none;
        }
        .app-logo svg {
            width: 32px;
            height: 32px;
            fill: var(--m3-primary);
        }
        .logo-text {
            font-weight: 700;
            font-size: 1.3rem;
            background: linear-gradient(135deg, var(--m3-primary), var(--m3-tertiary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .m3-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            color: var(--m3-on-surface-variant);
            transition: background 0.2s var(--m3-transition), color 0.2s var(--m3-transition);
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        .m3-icon-btn:hover {
            background: rgba(103, 80, 164, var(--m3-state-hover-opacity));
        }
        .m3-icon-btn:active {
            background: rgba(103, 80, 164, var(--m3-state-pressed-opacity));
        }
        .m3-icon-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
        .m3-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            background: var(--m3-secondary-container);
            color: var(--m3-on-secondary-container);
            user-select: none;
            transition: background 0.3s var(--m3-transition), color 0.3s var(--m3-transition);
        }
        .m3-chip svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .m3-tabs {
            display: flex;
            gap: 4px;
            padding: 8px 12px;
            background: var(--m3-surface-container-low);
            border-radius: var(--m3-radius-md);
            margin-bottom: 16px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .m3-tabs::-webkit-scrollbar {
            display: none;
        }
        .m3-tab {
            flex: 1;
            min-width: fit-content;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: var(--m3-radius-md);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--m3-on-surface-variant);
            transition: all 0.25s var(--m3-transition);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        .m3-tab svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
        }
        .m3-tab:hover {
            background: rgba(103, 80, 164, var(--m3-state-hover-opacity));
            color: var(--m3-on-surface);
        }
        .m3-tab.active {
            background: var(--m3-primary-container);
            color: var(--m3-on-primary-container);
            font-weight: 600;
        }
        .m3-tab.active::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            border-radius: 3px;
            background: var(--m3-primary);
        }

        .m3-panel {
            display: none;
            animation: panelFade 0.35s var(--m3-transition) forwards;
        }
        .m3-panel.active {
            display: block;
        }
        @keyframes panelFade {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel-content {
            padding: 24px 20px;
            background: var(--m3-surface-container);
            border-radius: var(--m3-radius-lg);
            box-shadow: var(--m3-elevation-1);
        }
        @media (min-width: 600px) {
            .panel-content { padding: 28px 24px; }
        }

        .upload-zone {
            border: 2px dashed var(--m3-outline-variant);
            border-radius: var(--m3-radius-md);
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s var(--m3-transition);
            position: relative;
            overflow: hidden;
            background: var(--m3-surface-container-low);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            text-align: center;
        }
        .upload-zone.dragover {
            border-color: var(--m3-primary);
            background: var(--m3-primary-container);
            opacity: 0.9;
        }
        .upload-zone:active { transform: scale(0.98); }
        .upload-zone .upload-icon {
            width: 48px;
            height: 48px;
            fill: var(--m3-primary);
            transition: transform 0.3s var(--m3-transition);
        }
        .upload-zone:hover .upload-icon { transform: translateY(-4px); }
        .upload-zone .upload-title {
            font-weight: 500;
            font-size: 1.05rem;
            color: var(--m3-on-surface);
        }
        .upload-zone .upload-subtitle {
            font-size: 0.82rem;
            color: var(--m3-on-surface-variant);
        }
        .upload-zone .upload-formats {
            font-size: 0.75rem;
            color: var(--m3-outline);
        }
        .upload-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .preview-thumb {
            max-width: 180px;
            max-height: 140px;
            border-radius: var(--m3-radius-sm);
            object-fit: contain;
            margin: 12px auto 0;
            box-shadow: var(--m3-elevation-1);
            display: block;
            transition: all 0.3s var(--m3-transition);
        }
        .preview-thumb.hidden { display: none; }

        .progress-container {
            margin-top: 16px;
            display: none;
        }
        .progress-container.visible { display: block; }
        .progress-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--m3-on-surface-variant);
        }
        .progress-percent {
            font-weight: 700;
            color: var(--m3-primary);
            font-variant-numeric: tabular-nums;
        }
        .progress-track {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: var(--m3-surface-variant);
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            background: var(--m3-primary);
            transition: width 0.4s var(--m3-transition);
            width: 0%;
        }

        .result-section {
            margin-top: 16px;
            display: none;
        }
        .result-section.visible { display: block; }
        .result-box {
            padding: 16px;
            border-radius: var(--m3-radius-md);
            background: var(--m3-surface-container-low);
            border: 1px solid var(--m3-outline-variant);
        }
        .result-code {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-align: center;
            padding: 8px 0;
            color: var(--m3-primary);
            user-select: all;
            font-variant-numeric: tabular-nums;
        }
        .result-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--m3-on-surface-variant);
        }
        .result-info .info-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 16px;
            background: var(--m3-secondary-container);
            color: var(--m3-on-secondary-container);
            font-weight: 500;
        }
        .result-info .info-pill svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
        .result-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .m3-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--m3-radius-sm);
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.01em;
            transition: all 0.25s var(--m3-transition);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        .m3-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        .m3-btn-filled {
            background: var(--m3-primary);
            color: var(--m3-on-primary);
            box-shadow: var(--m3-elevation-1);
        }
        .m3-btn-filled:hover { box-shadow: var(--m3-elevation-2); filter: brightness(1.05); }
        .m3-btn-filled:active { box-shadow: none; filter: brightness(0.95); }
        .m3-btn-tonal {
            background: var(--m3-secondary-container);
            color: var(--m3-on-secondary-container);
        }
        .m3-btn-tonal:hover { background: var(--m3-secondary-container); filter: brightness(0.95); box-shadow: var(--m3-elevation-1); }
        .m3-btn-text {
            background: transparent;
            color: var(--m3-primary);
            padding: 10px 12px;
        }
        .m3-btn-text:hover { background: rgba(103, 80, 164, var(--m3-state-hover-opacity)); }
        .m3-btn-error {
            background: var(--m3-error-container);
            color: var(--m3-on-error-container);
        }
        .m3-btn:disabled { opacity: 0.5; pointer-events: none; }

        .m3-text-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 140px;
        }
        .m3-text-field input {
            padding: 14px 16px;
            border-radius: var(--m3-radius-sm);
            border: 1px solid var(--m3-outline-variant);
            background: var(--m3-surface-container-lowest);
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            color: var(--m3-on-surface);
            transition: all 0.25s var(--m3-transition);
            outline: none;
            font-family: inherit;
        }
        .m3-text-field input:focus {
            border-color: var(--m3-primary);
            box-shadow: 0 0 0 2px rgba(103, 80, 164, 0.25);
        }
        .m3-text-field input::placeholder {
            color: var(--m3-outline);
            font-weight: 400;
            letter-spacing: 0.02em;
        }
        .input-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .metadata-section {
            margin-top: 16px;
            border-radius: var(--m3-radius-md);
            border: 1px solid var(--m3-outline-variant);
            background: var(--m3-surface-container-low);
            overflow: hidden;
        }
        .metadata-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s var(--m3-transition);
            background: var(--m3-surface-container);
        }
        .metadata-header:hover { background: var(--m3-surface-container-high); }
        .metadata-header .m3-chip { margin-left: 8px; }
        .metadata-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--m3-on-surface);
        }
        .metadata-toggle svg {
            width: 20px;
            height: 20px;
            fill: var(--m3-primary);
            transition: transform 0.3s var(--m3-transition);
        }
        .metadata-toggle svg.collapsed { transform: rotate(-90deg); }
        .metadata-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s var(--m3-transition);
        }
        .metadata-body.expanded {
            max-height: 600px;
            overflow-y: auto;
        }
        .metadata-content {
            padding: 12px 16px 16px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 8px;
        }
        .metadata-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 8px 12px;
            border-radius: var(--m3-radius-xs);
            background: var(--m3-surface-container);
            border: 1px solid var(--m3-outline-variant);
        }
        .metadata-item .meta-label {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--m3-on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .metadata-item .meta-value {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--m3-on-surface);
            word-break: break-all;
        }
        .metadata-empty {
            text-align: center;
            padding: 24px;
            color: var(--m3-outline);
            font-size: 0.85rem;
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            width: calc(100% - 32px);
            max-width: 420px;
        }
        .toast {
            padding: 14px 18px;
            border-radius: var(--m3-radius-sm);
            background: var(--m3-surface-container-high);
            border: 1px solid var(--m3-outline-variant);
            box-shadow: var(--m3-elevation-3);
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
            animation: toastIn 0.35s var(--m3-transition);
            transition: opacity 0.3s var(--m3-transition), transform 0.3s var(--m3-transition);
            color: var(--m3-on-surface);
        }
        .toast.removing { opacity: 0; transform: translateY(16px) scale(0.95); }
        .toast svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }
        .toast.success svg { color: #2e7d32; }
        .toast.error svg { color: var(--m3-error); }
        .toast.warning svg { color: #ed6c02; }
        .toast.info svg { color: var(--m3-primary); }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px) scale(0.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .perf-badge {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 100;
            font-size: 0.68rem;
            padding: 6px 10px;
            border-radius: 12px;
            background: var(--m3-surface-container-high);
            border: 1px solid var(--m3-outline-variant);
            color: var(--m3-on-surface-variant);
            opacity: 0;
            transition: opacity 0.4s var(--m3-transition);
            pointer-events: none;
            user-select: none;
            font-weight: 600;
        }
        .perf-badge.visible { opacity: 1; }

        .mode-explanation {
            margin-top: 16px;
            padding: 16px;
            border-radius: var(--m3-radius-md);
            background: var(--m3-surface-container-low);
            border: 1px solid var(--m3-outline-variant);
            font-size: 0.8rem;
            line-height: 1.7;
            color: var(--m3-on-surface-variant);
        }
        .mode-explanation strong { color: var(--m3-primary); font-weight: 600; }
        .mode-explanation .pros { color: #2e7d32; }
        .mode-explanation .cons { color: var(--m3-error); }

        @media (max-width: 480px) {
            body { padding: 8px; }
            .app-header { padding: 12px 14px; }
            .logo-text { font-size: 1.1rem; }
            .m3-tab { padding: 10px 8px; font-size: 0.72rem; gap: 4px; }
            .m3-tab svg { width: 16px; height: 16px; }
            .panel-content { padding: 16px 12px; }
            .upload-zone { padding: 20px 12px; }
            .result-code { font-size: 1.4rem; }
            .m3-btn { padding: 8px 14px; font-size: 0.78rem; }
            .metadata-content { grid-template-columns: 1fr; }
            .app-container { padding: 4px; }
        }

        @media (min-width: 601px) {
            .app-container { max-width: 860px; }
        }

        @media (prefers-reduced-motion: reduce) {

    <script>
        (function() {

            const IDB_STORE_NAME = 'blobs';

            // ===== State =====

            let currentTheme = localStorage.getItem('metaCleanerTheme') || 'light';
            let activeTab = 'upload';

            // ===== DOM Elements =====

            const perfBadge = document.getElementById('perfBadge');

            // ===== Icons =====
            const ICONS = {
                success: '<svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>',
                error: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>',
                warning: '<svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>',
                info: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>',
                copy: '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>',
                clock: '<svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>',
                file: '<svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>',
                image: '<svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>',
                server: '<svg viewBox="0 0 24 24"><path d="M4 1h16c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V3c0-1.1.9-2 2-2zm0 14h16c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-4c0-1.1.9-2 2-2zm0-7h16c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-4c0-1.1.9-2 2-2z"/></svg>',
                browser: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>',
            };

            // ===== Theme Management =====
            function applyTheme(theme, persist = true) {
                currentTheme = theme;
                if (theme === 'dark') {
                    body.setAttribute('data-theme', 'dark');
                    themeIconLight.style.display = 'none';
                    themeIconDark.style.display = 'block';
                    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1c1b1f');
                } else {
                    body.removeAttribute('data-theme');
                    themeIconLight.style.display = 'block';
                    themeIconDark.style.display = 'none';
                    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fdfcff');
                }
                if (persist) {
                    try { localStorage.setItem('metaCleanerTheme', theme); } catch (e) {}
                }
            }

            themeToggleBtn.addEventListener('click', () => {
                applyTheme(currentTheme === 'light' ? 'dark' : 'light');
            });

            // ===== Mode Management =====
            function applyMode(mode, persist = true) {
                currentMode = mode;
                if (mode === 'frontend') {
                    modeBadgeText.textContent = '前端处理';
                    modeExplanation.innerHTML =
                        '<strong>前端处理模式</strong>：图片在浏览器本地用 Canvas 重新绘制，元数据自动剥离，不上传任何数据到服务器。' +
                        '<span class="pros">优点：完全离线可用、隐私安全、速度极快。</span>' +
                        '<span class="cons">缺点：不支持 TIFF、大图可能卡顿、依赖浏览器能力。</span>';
                    modeBadge.querySelector('svg').outerHTML = ICONS.browser;
                } else {
                    modeBadgeText.textContent = '后端处理';
                    modeExplanation.innerHTML =
                        '<strong>后端处理模式</strong>：图片上传到服务器，服务器清除元数据后返回 6 位物件码，2 小时内可取件下载。' +
                        '<span class="pros">优点：不占本地资源、支持 TIFF 等更多格式。</span>' +
                        '<span class="cons">缺点：需联网、图片经过服务器。</span>';
                    modeBadge.querySelector('svg').outerHTML = ICONS.server;
                }
                if (persist) {
                    try { localStorage.setItem('metaCleanerMode', mode); } catch (e) {}
                }
            }

            modeToggleBtn.addEventListener('click', () => {
                const newMode = currentMode === 'backend' ? 'frontend' : 'backend';
                applyMode(newMode);
                showToast(
                    newMode === 'frontend' ? '已切换到前端处理模式，图片不会离开浏览器' : '已切换到后端处理模式，图片将上传服务器',
                    'info'
                );
                resetUploadResult();
            });

            // ===== Tab Management =====
            function switchTab(tabId) {
                activeTab = tabId;
                tabButtons.forEach(btn => {
                    const isActive = btn.dataset.tab === tabId;
                    btn.classList.toggle('active', isActive);
                    btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
                });
                tabPanels.forEach(panel => {
                    panel.classList.toggle('active', panel.id === `panel-${tabId}`);
                });
            }

            tabButtons.forEach(btn => {
                btn.addEventListener('click', () => switchTab(btn.dataset.tab));
            });

            // ===== Toast =====
            function showToast(message, type = 'info', duration = 3500) {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = (ICONS[type] || ICONS.info) + `<span>${escapeHtml(message)}</span>`;
                toastContainer.appendChild(toast);
                const removeToast = () => {
                    toast.classList.add('removing');
                    setTimeout(() => toast.remove(), 300);
                };
                toast._removeTimer = setTimeout(removeToast, duration);
                toast.addEventListener('click', () => {
                    clearTimeout(toast._removeTimer);
                    removeToast();
                });
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ===== Progress =====
            function showProgress(label) {
                progressContainer.classList.add('visible');
                progressLabel.textContent = label;
                setProgress(0);
            }

            function setProgress(value) {
                const clamped = Math.max(0, Math.min(100, value));
                progressFill.style.width = clamped + '%';
                progressPercent.textContent = Math.round(clamped) + '%';
            }

            function hideProgress() {
                progressContainer.classList.remove('visible');
                setProgress(0);
            }

            // ===== Reset =====
            function resetUploadResult() {
                resultSection.classList.remove('visible');
                previewThumb.classList.add('hidden');
                previewThumb.src = '';
                if (currentPreviewUrl) { URL.revokeObjectURL(currentPreviewUrl); currentPreviewUrl = null; }
                if (currentObjectUrl) { URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
                if (expireTimer) { clearInterval(expireTimer); expireTimer = null; }
                metadataSection.style.display = 'none';
                currentMetadata = [];
            }

            // ===== Metadata Display =====
            function displayMetadata(metadata) {
                if (!metadata || metadata.length === 0) {
                    metadataSection.style.display = 'none';
                    return;
                }
                currentMetadata = metadata;
                metadataSection.style.display = 'block';
                metadataCount.textContent = `${metadata.length} 项`;
                metadataContent.innerHTML = '';
                metadata.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'metadata-item';
                    div.innerHTML = `<span class="meta-label">${escapeHtml(item.label)}</span><span class="meta-value">${escapeHtml(item.value)}</span>`;
                    metadataContent.appendChild(div);
                });
                metadataBody.classList.remove('expanded');
                metadataChevron.classList.add('collapsed');
            }

            metadataHeader.addEventListener('click', () => {
                const expanded = metadataBody.classList.toggle('expanded');
                metadataChevron.classList.toggle('collapsed', !expanded);
            });

            // ===== EXIF / Metadata Parser =====
            async function extractImageMetadata(file) {
                try {
                    if (file.type === 'image/jpeg') {
                        return await parseJPEGEXIF(file);
                    } else if (file.type === 'image/png') {
                        return await parsePNGMetadata(file);
                    } else if (file.type === 'image/webp') {
                        return await parseWebPMetadata(file);
                    } else {
                        return [];
                    }
                } catch (e) {
                    console.warn('元数据解析失败:', e);
                    return [];
                }
            }

            async function parseJPEGEXIF(file) {
                const arrayBuffer = await file.arrayBuffer();
                const dataView = new DataView(arrayBuffer);
                if (dataView.getUint16(0) !== 0xFFD8) return [];
                let offset = 2;
                const metadata = [];
                const EXIF_IFD_TAGS = {
                    0x010E: '图像描述', 0x010F: '设备制造商', 0x0110: '设备型号',
                    0x0112: '方向', 0x0131: '软件', 0x0132: '修改时间',
                    0x013B: '作者', 0x8298: '版权', 0x8769: 'Exif偏移',
                    0x8825: 'GPS偏移', 0xA002: '图片宽度', 0xA003: '图片高度',
                    // 0x9003 已从 IFD0 中移除，标准中通常位于 SubIFD
                };
                const EXIF_SUB_TAGS = {
                    0x9003: '原始拍摄时间', 0x9201: '快门速度', 0x9202: '光圈值',
                    0x9209: '闪光灯', 0x920A: '焦距', 0xA405: '35mm焦距',
                    0xA406: '场景类型', 0xA408: '对比度', 0xA409: '饱和度', 0xA40A: '锐度'
                };
                const GPS_TAGS = {
                    0x0001: '纬度参考', 0x0002: '纬度', 0x0003: '经度参考', 0x0004: '经度',
                    0x0005: 'GPS状态', 0x001D: 'GPS日期'
                };
                // 存储 GPS 参考标记
                let latRef = '';
                let lonRef = '';

                while (offset < arrayBuffer.byteLength) {
                    if (dataView.getUint16(offset) !== 0xFFE1) {
                        offset += 2;
                        if (offset + 4 > arrayBuffer.byteLength) break;
                        const segLen = dataView.getUint16(offset + 2);
                        offset += 2 + segLen;
                        continue;
                    }
                    const exifStart = offset + 4;
                    if (dataView.getUint32(exifStart) !== 0x45786966) break;
                    const tiffOffset = exifStart + 6;
                    const byteOrder = dataView.getUint16(tiffOffset);
                    const isLE = byteOrder === 0x4949;
                    const readUint16 = (o) => dataView.getUint16(o, isLE);
                    const readUint32 = (o) => dataView.getUint32(o, isLE);
                    const ifd0Offset = tiffOffset + 2 + readUint32(tiffOffset + 4);
                    const numEntries = readUint16(ifd0Offset);
                    for (let i = 0; i < numEntries; i++) {
                        const entryOffset = ifd0Offset + 2 + i * 12;
                        const tag = readUint16(entryOffset);
                        const type = readUint16(entryOffset + 2);
                        const count = readUint32(entryOffset + 4);
                        const valueOffset = entryOffset + 8;
                        if (tag in EXIF_IFD_TAGS) {
                            let value = '';
                            const typeSizes = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8 };
                            const typeSize = typeSizes[type] || 1;
                            const totalBytes = typeSize * count;
                            const valuePtr = totalBytes > 4 ? tiffOffset + readUint32(valueOffset) : valueOffset;
                            try {
                                if (type === 2) {
                                    let str = '';
                                    for (let b = 0; b < count; b++) {
                                        str += String.fromCharCode(dataView.getUint8(valuePtr + b));
                                    }
                                    value = str.replace(/\0+$/, '').trim();
                                } else {
                                    value = readUint16(valuePtr).toString();
                                }
                            } catch (e) { value = '未知'; }
                            if (value && value !== '未知') {
                                metadata.push({ label: EXIF_IFD_TAGS[tag], value });
                            }
                        }
                        if (tag === 0x8769) {
                            const subIFDOffset = tiffOffset + readUint32(valueOffset);
                            const subNumEntries = readUint16(subIFDOffset);
                            for (let j = 0; j < subNumEntries; j++) {
                                const subEntry = subIFDOffset + 2 + j * 12;
                                const subTag = readUint16(subEntry);
                                if (subTag in EXIF_SUB_TAGS) {
                                    const subType = readUint16(subEntry + 2);
                                    const subCount = readUint32(subEntry + 4);
                                    const subValueOffset = subEntry + 8;
                                    const subTypeSize = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8 } [subType] ||
                                        1;
                                    const subTotal = subTypeSize * subCount;
                                    const subPtr = subTotal > 4 ? tiffOffset + readUint32(subValueOffset) : subValueOffset;
                                    try {
                                        if (subType === 2) {
                                            let str = '';
                                            for (let b = 0; b < subCount; b++) str += String.fromCharCode(dataView
                                                .getUint8(subPtr + b));
                                            metadata.push({ label: EXIF_SUB_TAGS[subTag], value: str.replace(
                                                    /\0+$/, '').trim() });
                                        } else {
                                            metadata.push({ label: EXIF_SUB_TAGS[subTag], value: readUint16(
                                                subPtr).toString() });
                                        }
                                    } catch (e) {}
                                }
                            }
                        }
                        if (tag === 0x8825) {
                            const gpsOffset = tiffOffset + readUint32(valueOffset);
                            const gpsNumEntries = readUint16(gpsOffset);
                            for (let g = 0; g < gpsNumEntries; g++) {
                                const gpsEntry = gpsOffset + 2 + g * 12;
                                const gpsTag = readUint16(gpsEntry);
                                const gpsType = readUint16(gpsEntry + 2);
                                const gpsCount = readUint32(gpsEntry + 4);
                                const gpsValueOffset = gpsEntry + 8;
                                // 捕获参考标记
                                if (gpsTag === 0x0001) {
                                    // 纬度参考 N/S
                                    if (gpsType === 2) {
                                        let str = '';
                                        for (let b = 0; b < gpsCount; b++) str += String.fromCharCode(dataView.getUint8(
                                            gpsValueOffset + b));
                                        latRef = str.replace(/\0+$/, '').trim();
                                    }
                                    continue; // 不直接加入 metadata
                                }
                                if (gpsTag === 0x0003) {
                                    // 经度参考 E/W
                                    if (gpsType === 2) {
                                        let str = '';
                                        for (let b = 0; b < gpsCount; b++) str += String.fromCharCode(dataView.getUint8(
                                            gpsValueOffset + b));
                                        lonRef = str.replace(/\0+$/, '').trim();
                                    }
                                    continue;
                                }
                                // 解析数值标签
                                if (gpsTag in GPS_TAGS) {
                                    let gpsValue = '';
                                    try {
                                        if (gpsType === 2) {
                                            let str = '';
                                            for (let b = 0; b < gpsCount; b++) str += String.fromCharCode(dataView
                                                .getUint8(gpsValueOffset + b));
                                            gpsValue = str.replace(/\0+$/, '').trim();
                                        } else if (gpsType === 5 && gpsCount === 3) {
                                            const deg = readUint32(gpsValueOffset) / 1;
                                            const min = readUint32(gpsValueOffset + 4) / 1;
                                            const sec = readUint32(gpsValueOffset + 8) / 1000000;
                                            gpsValue = `${deg}°${min}'${sec.toFixed(2)}"`;
                                            // 根据参考标记添加符号
                                            if (gpsTag === 0x0002 && latRef === 'S') gpsValue = '-' + gpsValue;
                                            if (gpsTag === 0x0004 && lonRef === 'W') gpsValue = '-' + gpsValue;
                                        } else {
                                            gpsValue = readUint16(gpsValueOffset).toString();
                                        }
                                        metadata.push({ label: GPS_TAGS[gpsTag], value: gpsValue });
                                    } catch (e) {}
                                }
                            }
                        }
                    }
                    break;
                }
                return metadata;
            }

            async function parsePNGMetadata(file) {
                const arrayBuffer = await file.arrayBuffer();
                const dataView = new DataView(arrayBuffer);
                if (dataView.getUint32(0) !== 0x89504E47) return [];
                let offset = 8;
                const metadata = [];
                while (offset < arrayBuffer.byteLength) {
                    const length = dataView.getUint32(offset);
                    const chunkType = String.fromCharCode(
                        dataView.getUint8(offset + 4),
                        dataView.getUint8(offset + 5),
                        dataView.getUint8(offset + 6),
                        dataView.getUint8(offset + 7)
                    );
                    const chunkDataStart = offset + 8;
                    if (chunkType === 'tEXt') {
                        const data = new Uint8Array(arrayBuffer.slice(chunkDataStart, chunkDataStart + length));
                        const nullIndex = data.indexOf(0);
                        if (nullIndex > 0) {
                            const keyword = new TextDecoder().decode(data.slice(0, nullIndex));
                            const value = new TextDecoder().decode(data.slice(nullIndex + 1));
                            metadata.push({ label: keyword, value });
                        }
                    } else if (chunkType === 'eXIf') {
                        const exifData = new Blob([arrayBuffer.slice(chunkDataStart, chunkDataStart + length)], { type: 'image/jpeg' });
                        const exifMetadata = await parseJPEGEXIF(exifData);
                        metadata.push(...exifMetadata);
                    }
                    offset += 12 + length;
                }
                return metadata;
            }

            async function parseWebPMetadata(file) {
                const arrayBuffer = await file.arrayBuffer();
                const dataView = new DataView(arrayBuffer);
                if (dataView.getUint32(0) !== 0x52494646 || dataView.getUint32(8) !== 0x57454250) return [];
                let offset = 12;
                const metadata = [];
                while (offset < arrayBuffer.byteLength) {
                    const chunkId = String.fromCharCode(
                        dataView.getUint8(offset),
                        dataView.getUint8(offset + 1),
                        dataView.getUint8(offset + 2),
                        dataView.getUint8(offset + 3)
                    );
                    const chunkSize = dataView.getUint32(offset + 4, true);
                    const chunkDataStart = offset + 8;
                    if (chunkId === 'EXIF') {
                        const exifData = new Blob([arrayBuffer.slice(chunkDataStart, chunkDataStart + chunkSize)], { type: 'image/jpeg' });
                        const exifMetadata = await parseJPEGEXIF(exifData);
                        metadata.push(...exifMetadata);
                    } else if (chunkId === 'XMP ') {
                        const xmpData = new TextDecoder().decode(new Uint8Array(arrayBuffer.slice(chunkDataStart,
                            chunkDataStart + chunkSize)));
                        metadata.push({ label: 'XMP数据', value: xmpData.slice(0, 200) });
                    }
                    offset += 8 + chunkSize;
                    if (chunkSize % 2 === 1) offset += 1;
                }
                return metadata;
            }

            // ===== Backend Processing =====
            async function processBackend(file) {
                if (currentController) currentController.abort();
                currentController = new AbortController();
                const formData = new FormData();
                formData.append('file', file);

                showProgress('上传图片中...');
                setProgress(0);

                try {
                    const result = await new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', API_UPLOAD, true);
                        xhr.responseType = 'json';
                        xhr.timeout = 120000;

                        xhr.upload.addEventListener('progress', (e) => {
                            if (e.lengthComputable) {
                                setProgress(e.loaded / e.total * 85);
                                progressLabel.textContent = '上传中...';
                            }
                        });
                        xhr.upload.addEventListener('load', () => {
                            setProgress(88);
                            progressLabel.textContent = '服务器处理中...';
                        });
                        xhr.addEventListener('load', () => {
                            if (xhr.status >= 200 && xhr.status < 300) {
                                setProgress(100);
                                progressLabel.textContent = '完成！';
                                resolve(xhr.response);
                            } else {
                                let errorMsg = `上传失败 (${xhr.status})`;
                                try { if (xhr.response?.detail) errorMsg = xhr.response.detail; } catch (e) {}
                                reject(new Error(errorMsg));
                            }
                        });
                        xhr.addEventListener('error', () => reject(new Error('网络错误')));
                        xhr.addEventListener('timeout', () => reject(new Error('上传超时')));
                        xhr.addEventListener('abort', () => reject(new Error('上传已取消')));
                        xhr.send(formData);
                        currentController._xhr = xhr;
                        currentController.signal.addEventListener('abort', () => { try { xhr.abort(); } catch (e) {} });
                    });

                    if (result?.success && result.code) {
                        uploadedFileName = result.filename || file.name;
                        showUploadResult(result.code, uploadedFileName, result.expires_in_seconds || EXPIRE_SECONDS, [
                            { label: '复制物件码', icon: ICONS.copy, className: 'm3-btn-tonal', onClick: () => copyText(result.code) },
                            { label: '预览图片', icon: ICONS.image, className: 'm3-btn-filled', onClick: () => openDownloadPreview(result.code) },
                            { label: '下载图片', icon: ICONS.success, className: 'm3-btn-filled', onClick: () => triggerDownload(result.code) }
                        ]);
                        showToast('上传成功，物件码 ' + result.code, 'success');
                    } else throw new Error('服务器返回异常');
                } catch (err) {
                    showToast(err.message || '上传失败', 'error');
                    showUploadError(err.message || '上传失败');
                } finally {
                    setTimeout(() => { if (progressFill.style.width === '100%') hideProgress(); }, 800);
                    currentController = null;
                }
            }

            function showUploadError(message) {
                resultSection.classList.add('visible');
                resultCode.textContent = 'ERROR';
                resultInfo.innerHTML = '';
                const errSpan = document.createElement('span');
                errSpan.className = 'info-pill';
                errSpan.innerHTML = ICONS.error + ` <span>${escapeHtml(message)}</span>`;
                resultInfo.appendChild(errSpan);
                resultActions.innerHTML = '';
            }

            // ===== Frontend Processing =====
            async function processFrontend(file) {
                showProgress('正在读取图片...');
                setProgress(5);

                try {
                    const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
                    if (!validTypes.includes(file.type)) throw new Error('前端仅支持 JPG、PNG、WEBP。TIFF 请切换后端。');
                    if (file.size > MAX_FILE_SIZE) throw new Error('文件超过 50MB 限制');

                    const arrayBuffer = await file.arrayBuffer();
                    setProgress(20);
                    progressLabel.textContent = '解码图片...';

                    let bitmap;
                    try { bitmap = await createImageBitmap(new Blob([arrayBuffer], { type: file.type })); } catch (e) {
                        bitmap = await loadImageFallback(URL.createObjectURL(new Blob([arrayBuffer], { type: file.type }))); }

                    setProgress(45);
                    progressLabel.textContent = '清除元数据中...';

                    let width = bitmap.width;
                    let height = bitmap.height;
                    if (width > MAX_CANVAS_DIMENSION || height > MAX_CANVAS_DIMENSION) {
                        const scale = Math.min(MAX_CANVAS_DIMENSION / width, MAX_CANVAS_DIMENSION / height);
                        width = Math.round(width * scale);
                        height = Math.round(height * scale);
                    }

                    const isJPEG = file.type === 'image/jpeg';
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d', { alpha: !isJPEG });
                    if (isJPEG) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, width, height); }
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(bitmap, 0, 0, width, height);

                    setProgress(65);
                    progressLabel.textContent = '生成无元数据图片...';
                    if (bitmap.close) bitmap.close();

                    const blob = await new Promise((resolve, reject) => {
                        canvas.toBlob(b => b ? resolve(b) : reject(new Error('导出失败')), file.type || 'image/png', 0.92);
                    });

                    setProgress(85);
                    progressLabel.textContent = '创建本地物件码...';

                    const localCode = generateLocalCode();
                    const blobUrl = URL.createObjectURL(blob);
                    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
                    currentObjectUrl = blobUrl;

                    try { await storeBlobInIDB(localCode, blob); } catch (e) { console.warn('IDB存储失败', e); }
                    try {
                        localStorage.setItem(`metaCleanerLocal_${localCode}`, JSON.stringify({
                            code: localCode,
                            filename: file.name,
                            createdAt: Date.now(),
                            expiresAt: Date.now() + EXPIRE_SECONDS * 1000
                        }));
                    } catch (e) {}

                    setProgress(100);
                    progressLabel.textContent = '完成！';
                    uploadedFileName = file.name;

                    showUploadResult(localCode, file.name, EXPIRE_SECONDS, [
                        { label: '复制物件码', icon: ICONS.copy, className: 'm3-btn-tonal', onClick: () => copyText(localCode) },
                        { label: '下载图片', icon: ICONS.success, className: 'm3-btn-filled', onClick: () => downloadFrontendBlob(localCode, file.name) },
                        { label: '预览图片', icon: ICONS.image, className: 'm3-btn-tonal', onClick: () => previewFrontendBlob(localCode) }
                    ]);

                    if (currentPreviewUrl) URL.revokeObjectURL(currentPreviewUrl);
                    currentPreviewUrl = blobUrl;
                    previewThumb.src = blobUrl;
                    previewThumb.classList.remove('hidden');

                    showToast('前端处理完成，图片未离开浏览器', 'success');
                    canvas.width = 0; canvas.height = 0;

                } catch (err) {
                    showToast(err.message || '前端处理失败', 'error');
                    showUploadError(err.message || '前端处理失败');
                } finally {
                    setTimeout(() => { if (progressFill.style.width === '100%') hideProgress(); }, 800);
                }
            }

            function loadImageFallback(url) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
                    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片解码失败')); };
                    img.src = url;
                });
            }

            function generateLocalCode() {
                const stored = [];
                try {
                    for (let i = 0; i < localStorage.length; i++) {
                        const k = localStorage.key(i);
                        if (k?.startsWith('metaCleanerLocal_')) stored.push(k.replace('metaCleanerLocal_', ''));
                    }
                } catch (e) {}
                let code;
                do { code = String(Math.floor(100000 + Math.random() * 900000)); } while (stored.includes(code));
                return code;
            }

            // ===== IndexedDB Helpers =====
            let dbPromise = null;

            function openIDB() {
                if (!dbPromise) {
                    dbPromise = new Promise((resolve, reject) => {
                        if (!('indexedDB' in window)) { reject(new Error('不支持IDB')); return; }
                        const req = indexedDB.open(IDB_DB_NAME, 1);
                        req.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains(IDB_STORE_NAME)) db.createObjectStore(IDB_STORE_NAME, { keyPath: 'code' });
                        };
                        req.onsuccess = (e) => resolve(e.target.result);
                        req.onerror = (e) => reject(e.target.error);
                    });
                }
                return dbPromise;
            }

            async function storeBlobInIDB(code, blob) {
                const db = await openIDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(IDB_STORE_NAME, 'readwrite');
                    const store = tx.objectStore(IDB_STORE_NAME);
                    store.put({ code, blob, timestamp: Date.now() });
                    tx.oncomplete = () => resolve();
                    tx.onerror = (e) => reject(e.target.error);
                });
            }

            async function getBlobFromIDB(code) {
                try {
                    const db = await openIDB();
                    return new Promise((resolve) => {
                        const tx = db.transaction(IDB_STORE_NAME, 'readonly');
                        const req = tx.objectStore(IDB_STORE_NAME).get(code);
                        req.onsuccess = () => resolve(req.result?.blob || null);
                        req.onerror = () => resolve(null);
                    });
                } catch (e) { return null; }
            }

            async function deleteBlobFromIDB(code) {
                try {
                    const db = await openIDB();
                    return new Promise((resolve) => {
                        const tx = db.transaction(IDB_STORE_NAME, 'readwrite');
                        tx.objectStore(IDB_STORE_NAME).delete(code);
                        tx.oncomplete = () => resolve();
                        tx.onerror = () => resolve();
                    });
                } catch (e) {}
            }

            async function cleanupExpiredIDB() {
                try {
                    const db = await openIDB();
                    const tx = db.transaction(IDB_STORE_NAME, 'readwrite');
                    const store = tx.objectStore(IDB_STORE_NAME);
                    const req = store.openCursor();
                    req.onsuccess = (e) => {
                        const cursor = e.target.result;
                        if (cursor) {
                            const data = getLocalCodeData(cursor.value.code);
                            if (!data || Date.now() > data.expiresAt) store.delete(cursor.value.code);
                            cursor.continue();
                        }
                    };
                } catch (e) {}
            }

            // ===== Upload Zone Events =====
            uploadZone.addEventListener('click', (e) => { if (e.target !== fileInput) fileInput.click(); });
            uploadZone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault();
                    fileInput.click(); } });
            fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => uploadZone.addEventListener(ev, e => { e
                    .preventDefault(); e.stopPropagation(); }));
            uploadZone.addEventListener('dragenter', () => uploadZone.classList.add('dragover'));
            uploadZone.addEventListener('dragover', () => uploadZone.classList.add('dragover'));
            uploadZone.addEventListener('dragleave', (e) => { if (!uploadZone.contains(e.relatedTarget)) uploadZone
                    .classList.remove('dragover'); });
            uploadZone.addEventListener('drop', (e) => {
                uploadZone.classList.remove('dragover');
                if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
            });

            document.addEventListener('paste', (e) => {
                if (activeTab !== 'upload') return;
                const items = e.clipboardData?.items;
                if (items) {
                    for (const item of items) {
                        if (item.type.startsWith('image/')) {
                            const f = item.getAsFile();
                            if (f) { handleFile(f); e.preventDefault(); break; }
                        }
                    }
                }
            });

            // ===== File Handler =====
            async function handleFile(file) {
                resetUploadResult();
                uploadedFileName = file.name;

                if (!file.type.startsWith('image/')) { showToast('不支持的格式', 'error'); return; }
                if (file.size > MAX_FILE_SIZE) { showToast('文件超过50MB', 'error'); return; }
                if (file.size === 0) { showToast('文件为空', 'error'); return; }

                if (file.type !== 'image/tiff') {
                    const previewUrl = URL.createObjectURL(file);
                    if (currentPreviewUrl) URL.revokeObjectURL(currentPreviewUrl);
                    currentPreviewUrl = previewUrl;
                    previewThumb.src = previewUrl;
                    previewThumb.classList.remove('hidden');
                } else {
                    previewThumb.classList.add('hidden');
                }

                const metadata = await extractImageMetadata(file);
                displayMetadata(metadata);

                if (currentMode === 'frontend') await processFrontend(file);
                else await processBackend(file);
            }

            // ===== Query =====
            queryBtn.addEventListener('click', async () => {
                const code = queryCodeInput.value.trim();
                if (!/^\d{6}$/.test(code)) {
                    showToast('请输入6位数字物件码', 'warning');
                    queryError.style.display = 'block';
                    queryError.innerHTML = `<div class="m3-card-outlined" style="padding:16px;">${ICONS.error} <span>请输入6位数字物件码</span></div>`;
                    queryResult.style.display = 'none';
                    return;
                }
                await performQuery(code);
            });
            queryCodeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') queryBtn.click(); });
            queryCodeInput.addEventListener('input', () => {
                queryCodeInput.value = queryCodeInput.value.replace(/\D/g, '').slice(0, 6);
                queryError.style.display = 'none'; queryResult.style.display = 'none';
            });

            async function performQuery(code) {
                queryResult.style.display = 'none'; queryError.style.display = 'none';
                queryBtn.disabled = true;
                queryBtn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite;"></span> 查询中...';

                try {
                    const localData = getLocalCodeData(code);
                    if (localData) {
                        const remaining = Math.max(0, EXPIRE_SECONDS - Math.floor((Date.now() - localData.createdAt) / 1000));
                        if (remaining <= 0) { removeLocalCode(code); await deleteBlobFromIDB(code); throw new Error('物件码已过期'); }
                        queryResult.style.display = 'block';
                        queryResult.innerHTML = `
                            <div class="m3-card-outlined" style="padding:16px;">
                                <div style="display:flex;justify-content:space-between;padding:8px 0;"><span style="color:var(--m3-on-surface-variant);">${ICONS.file} 文件名</span><strong>${escapeHtml(localData.filename)}</strong></div>
                                <div style="display:flex;justify-content:space-between;padding:8px 0;"><span style="color:var(--m3-on-surface-variant);">${ICONS.clock} 剩余时间</span><strong>${formatTime(remaining)}</strong></div>
                                <div style="display:flex;justify-content:space-between;padding:8px 0;"><span style="color:var(--m3-on-surface-variant);">${ICONS.server} 处理方式</span><strong>前端本地</strong></div>
                            </div>`;
                        showToast('查询成功', 'success');
                        return;
                    }
                    const response = await fetch(`${API_INFO}/${code}`, { signal: AbortSignal.timeout(10000) });
                    if (response.ok) {
                        const data = await response.json();
                        if (data.success) {
                            queryResult.style.display = 'block';
                            queryResult.innerHTML = `
                                <div class="m3-card-outlined" style="padding:16px;">
                                    <div style="display:flex;justify-content:space-between;padding:8px 0;"><span style="color:var(--m3-on-surface-variant);">${ICONS.file} 文件名</span><strong>${escapeHtml(data.filename || '未知')}</strong></div>
                                    <div style="display:flex;justify-content:space-between;padding:8px 0;"><span style="color:var(--m3-on-surface-variant);">${ICONS.clock} 剩余时间</span><strong>${formatTime(data.remaining_seconds || 0)}</strong></div>
                                    <div style="display:flex;justify-content:space-between;padding:8px 0;"><span style="color:var(--m3-on-surface-variant);">${ICONS.server} 处理方式</span><strong>后端服务器</strong></div>
                                </div>`;
                            showToast('查询成功', 'success');
                        } else throw new Error('查询失败');
                    } else if (response.status === 404) throw new Error('物件码不存在或已过期');
                    else throw new Error(`查询失败 (${response.status})`);
                } catch (err) {
                    queryError.style.display = 'block';
                    queryError.innerHTML = `<div class="m3-card-outlined" style="padding:16px;border-color:var(--m3-error);">${ICONS.error} <span>${escapeHtml(err.message)}</span></div>`;
                    showToast(err.message, 'error');
                } finally {
                    queryBtn.disabled = false;
                    queryBtn.innerHTML = `${ICONS.info} 查询`;
                }
            }

            function getLocalCodeData(code) {
                try { const d = localStorage.getItem(`metaCleanerLocal_${code}`); return d ? JSON.parse(d) : null; } catch (
                    e) { return null; }
            }

            function removeLocalCode(code) {
                try { localStorage.removeItem(`metaCleanerLocal_${code}`); } catch (e) {}
            }

            // ===== Download =====
            downloadBtn.addEventListener('click', () => {
                const code = downloadCodeInput.value.trim();
                if (!/^\d{6}$/.test(code)) {
                    showToast('请输入6位数字物件码', 'warning');
                    downloadError.style.display = 'block';
                    downloadError.innerHTML = `<div class="m3-card-outlined" style="padding:16px;">${ICONS.error} <span>请输入6位数字物件码</span></div>`;
                    downloadPreview.style.display = 'none';
                    return;
                }
                triggerDownload(code);
            });
            previewBtn.addEventListener('click', () => {
                const code = downloadCodeInput.value.trim();
                if (!/^\d{6}$/.test(code)) {
                    showToast('请输入6位数字物件码', 'warning');
                    downloadError.style.display = 'block';
                    downloadError.innerHTML = `<div class="m3-card-outlined" style="padding:16px;">${ICONS.error} <span>请输入6位数字物件码</span></div>`;
                    downloadPreview.style.display = 'none';
                    return;
                }
                openDownloadPreview(code);
            });
            downloadCodeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') triggerDownload(downloadCodeInput
                    .value.trim()); });
            downloadCodeInput.addEventListener('input', () => {
                downloadCodeInput.value = downloadCodeInput.value.replace(/\D/g, '').slice(0, 6);
                downloadError.style.display = 'none'; downloadPreview.style.display = 'none';
            });

            async function triggerDownload(code) {
                const localData = getLocalCodeData(code);
                if (localData) {
                    const remaining = EXPIRE_SECONDS - Math.floor((Date.now() - localData.createdAt) / 1000);
                    if (remaining <= 0) { removeLocalCode(code); await deleteBlobFromIDB(code); showToast('物件码已过期',
                            'error'); return; }
                    await downloadFrontendBlob(code, localData.filename);
                    return;
                }
                window.location.href = `${API_DOWNLOAD}/${code}`;
                showToast('下载已触发', 'success');
            }

            async function openDownloadPreview(code) {
                const localData = getLocalCodeData(code);
                if (localData) {
                    const remaining = EXPIRE_SECONDS - Math.floor((Date.now() - localData.createdAt) / 1000);
                    if (remaining <= 0) { removeLocalCode(code); await deleteBlobFromIDB(code); showToast('物件码已过期',
                            'error'); return; }
                    const blob = await getBlobFromIDB(code);
                    if (blob) {
                        const url = URL.createObjectURL(blob);
                        downloadPreview.style.display = 'block';
                        downloadPreview.innerHTML = `<div class="m3-card-outlined" style="padding:16px;text-align:center;">${ICONS.image} <span>本地图片预览：</span><br><img src="${url}" style="max-width:100%;max-height:280px;border-radius:12px;margin-top:8px;"></div>`;
                        downloadError.style.display = 'none';
                        setTimeout(() => URL.revokeObjectURL(url), 30000);
                    } else {
                        downloadPreview.style.display = 'none';
                        downloadError.style.display = 'block';
                        downloadError.innerHTML = `<div class="m3-card-outlined" style="padding:16px;">${ICONS.error} <span>图片数据已失效</span></div>`;
                    }
                    return;
                }
                downloadPreview.style.display = 'block';
                downloadPreview.innerHTML = `<div class="m3-card-outlined" style="padding:16px;text-align:center;"><span style="color:var(--m3-primary);">加载预览中...</span></div>`;
                downloadError.style.display = 'none';
                const img = new Image();
                img.onload = () => {
                    downloadPreview.innerHTML = `<div class="m3-card-outlined" style="padding:16px;text-align:center;">${ICONS.image} <span>图片预览：</span><br><img src="${API_DOWNLOAD}/${code}" style="max-width:100%;max-height:280px;border-radius:12px;margin-top:8px;"></div>`;
                };
                img.onerror = () => {
                    downloadPreview.style.display = 'none';
                    downloadError.style.display = 'block';
                    downloadError.innerHTML = `<div class="m3-card-outlined" style="padding:16px;border-color:var(--m3-error);">${ICONS.error} <span>预览失败，物件码可能已过期</span></div>`;
                };
                img.src = `${API_DOWNLOAD}/${code}?t=${Date.now()}`;
            }

            async function downloadFrontendBlob(code, filename) {
                const blob = await getBlobFromIDB(code);
                if (!blob) { showToast('图片数据已失效', 'error'); return; }
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const ext = filename.split('.').pop() || 'jpg';
                a.href = url;
                a.download = filename.replace(/\.[^.]+$/, '') + '_cleaned.' + ext;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
                showToast('下载已开始', 'success');
            }

            // ===== Copy =====
            async function copyText(text) {
                try { await navigator.clipboard.writeText(text); showToast('已复制', 'success'); } catch (e) {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand('copy'); showToast('已复制', 'success'); } catch (err) { showToast('复制失败',
                            'warning'); }
                    document.body.removeChild(ta);
                }
            }

            // ===== Performance Monitor =====
            function startPerfMonitor() {
                if (perfMonitorRunning) return;
                perfMonitorRunning = true;
                perfFrameCount = 0;
                perfLastTime = performance.now();
                perfFPS = 60;
                perfLowFrames = 0;

                function checkPerf() {
                    const now = performance.now();
                    const delta = now - perfLastTime;
                    if (delta >= PERF_CHECK_INTERVAL) {
                        perfFPS = (perfFrameCount * 1000) / delta;
                        perfFrameCount = 0;
                        perfLastTime = now;
                        if (perfFPS < 30) {
                            perfLowFrames++;
                            if (perfLowFrames >= 2 && perfBadge) {
                                perfBadge.textContent = `低帧率: ${Math.round(perfFPS)} FPS`;
                                perfBadge.classList.add('visible');
                                setTimeout(() => { if (perfFPS > 40) perfBadge.classList.remove('visible'); }, 3000);
                            }
                        } else {
                            perfLowFrames = 0;
                        }
                    }
                    perfFrameCount++;
                    requestAnimationFrame(checkPerf);
                }
                requestAnimationFrame(checkPerf);
            }

            // ===== Network =====
            window.addEventListener('online', () => { isOffline = false; showToast('网络已恢复', 'success'); });
            window.addEventListener('offline', () => { isOffline = true; showToast('网络断开，前端模式仍可用', 'warning'); });

            // ===== Cleanup =====
            function cleanupMemory() {
                if (currentPreviewUrl && !previewThumb.src.includes(currentPreviewUrl)) {
                    URL.revokeObjectURL(currentPreviewUrl);
                    currentPreviewUrl = null;
                }
                cleanupExpiredLocalCodes();
            }

            function cleanupExpiredLocalCodes() {
                try {
                    const keys = [];
                    for (let i = 0; i < localStorage.length; i++) {
                        const k = localStorage.key(i);
                        if (k?.startsWith('metaCleanerLocal_')) keys.push(k);
                    }
                    keys.forEach(k => {
                        try {
                            const d = JSON.parse(localStorage.getItem(k));
                            if (d?.expiresAt && Date.now() > d.expiresAt) {
                                const code = k.replace('metaCleanerLocal_', '');
                                localStorage.removeItem(k);
                                deleteBlobFromIDB(code);
                            }
                        } catch (e) { localStorage.removeItem(k); }
                    });
                } catch (e) {}
                cleanupExpiredIDB();
            }

            const memoryCleanupInterval = setInterval(cleanupMemory, 60000);

            // ===== Init =====
            function init() {
                applyTheme(currentTheme, false);
                applyMode(currentMode, false);
                startPerfMonitor();
                cleanupExpiredLocalCodes();

                document.addEventListener('visibilitychange', () => { if (document.hidden) cleanupMemory(); });
                window.addEventListener('beforeunload', () => {
                    if (currentPreviewUrl) URL.revokeObjectURL(currentPreviewUrl);
                    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
                    if (expireTimer) clearInterval(expireTimer);
                    clearInterval(memoryCleanupInterval);
                    if (currentController) { try { currentController.abort(); } catch (e) {} }
                });
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
        })();
    </script>
</body>
</html>
